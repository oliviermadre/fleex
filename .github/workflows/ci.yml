name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build

      # Reads packages/web/dist/.vite/{manifest,chunk-modules}.json from the
      # step above, so it must stay after Build. Writes its table to the job
      # summary. Fails the job on a first-paint regression — see
      # packages/web/bundle-budget.json for the ceilings.
      - name: Bundle budget
        run: node scripts/bundle-budget.mjs

      - name: Run tests
        run: bun run test

      - name: Run Bun-runtime tests (bun:sqlite)
        run: bun run test:bun
