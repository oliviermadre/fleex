name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it is the record of what actually shipped.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # shellcheck ships preinstalled on the ubuntu-latest image.
      - name: Lint install.sh
        run: shellcheck --severity=warning --shell=bash install.sh

  build-test:
    name: Lint & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # We want to know when something breaks on a single platform only.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version that generated bun.lock — "latest" turns
          # unrelated upstream changes into red builds.
          bun-version: 1.3.10

      - name: Cache bun install cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build

      # Coverage floors are measured on one platform only: V8 counters can
      # drift between OSes, and enforcing the same floors twice would double
      # the false-red rate without catching anything new.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: bun run test:coverage

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: bun run test

      - name: Run Bun-runtime tests (bun:sqlite)
        run: bun run test:bun
