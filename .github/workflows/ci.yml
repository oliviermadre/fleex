name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The host gateway runs actions in `/bin/zsh -l -c` (macOS default shell);
      # its streaming-exec tests spawn the real shell, absent from ubuntu-latest.
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Run tests
        run: bun run test

      - name: Run Bun-runtime tests (bun:sqlite)
        run: bun run test:bun
