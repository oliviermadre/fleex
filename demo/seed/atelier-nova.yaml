# « Atelier Nova » — a fictional company whose backlog always looks presentable.
# Atelier Nova sells creative workshops (ceramics, bookbinding, watercolour…)
# booked online. Dates are relative to `fleex demo reset` (-30m, -2h, -3d, -1w).
# Format: docs/releases.md. Keep it believable: real titles, varied statuses,
# a few agents at work, a few humans in the loop.

personas:
  - { name: catalyst, displayName: The Catalyst, emoji: "💡", role: "Transforme une idée en PRD." }
  - { name: builder, displayName: The Builder, emoji: "🔨", role: "Transforme une spec en PR." }
  - { name: guardian, displayName: The Guardian, emoji: "🛡️", role: "Relit le code avant le merge." }
  - { name: herald, displayName: Herald, emoji: "📣", role: "Raconte ce que la feature change pour l'utilisateur." }

boards:
  - { key: nova, name: "Atelier Nova", emoji: "🎨", createdAt: -60d }
  - { key: ops, name: "Animateurs & Ops", emoji: "🧑‍🎨", createdAt: -45d }

epics:
  - { key: checkout, name: "Tunnel de réservation", emoji: "🛒", boards: [nova], timeframe: now, description: "Réserver un atelier en moins d'une minute." }
  - { key: hosts, name: "Espace animateur", emoji: "🧑‍🏫", boards: [nova, ops], timeframe: now, description: "Donner aux animateurs une vitrine et des outils." }
  - { key: growth, name: "Fidélisation", emoji: "🌱", boards: [nova], timeframe: next, description: "Faire revenir les participants." }

