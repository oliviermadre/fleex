<title>Factory Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a one-screen app. A nav rail, then either the Factory floor (the workbench slides over it) or the Work view
   (the queue, then the same workbench). Single dark look on purpose: it mirrors Fleex's own Ember theme
   (packages/web/src/index.css), so what is judged here is the flow, not a new skin. */
:root{
  color-scheme:dark;
  --bg:#09090b;--surface:#18181b;--overlay:#27272a;--hover:rgba(63,63,70,.42);
  --border:#27272a;--border-in:#3f3f46;
  --t1:#fafafa;--t2:#a1a1aa;--t3:#82828b;--t4:#5f5f68;
  --accent:#D77655;--accent-h:#e08868;--accent-m:rgba(215,118,85,.16);--on-accent:#1b0f0a;
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.14);--warn:#eab308;--warn-bg:rgba(234,179,8,.14);--danger:#ef4444;--danger-bg:rgba(239,68,68,.14);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,.15);--blue:#60a5fa;--blue-bg:rgba(96,165,250,.15);--teal:#2dd4bf;--teal-bg:rgba(45,212,191,.14);
  --ty-build:#4ade80;--ty-fix:#f87171;--ty-review:#facc15;--ty-ops:#2dd4bf;--ty-lead:#c084fc;--ty-think:#60a5fa;
  --scrim:rgba(0,0,0,.55);--glass:rgba(24,24,27,.94);
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);font-weight:600}
#app{height:100%;display:flex;min-width:0}

/* ---------- nav rail ---------- */
.rail{flex:none;width:56px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px;padding-left:env(safe-area-inset-left,0px)}
.rail .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.rail button{width:44px;padding:6px 0;border-radius:8px;display:grid;place-items:center;gap:2px;color:var(--t3);font-size:10px}
.rail button .mono{font-size:16px;line-height:1}
.rail button:hover{background:var(--hover);color:var(--t1)}
.rail button[aria-current=page]{background:var(--accent-m);color:var(--accent)}
.rail .dim{opacity:.35;pointer-events:none}
#main{flex:1;min-width:0;position:relative;display:flex}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border-in);background:var(--surface);font-size:12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--overlay)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}.btn.pri:hover{background:var(--accent-h)}
.btn.ghost{border-color:transparent;background:none;color:var(--t2)}.btn.ghost:hover{background:var(--hover);color:var(--t1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052e16;font-weight:600}
.btn kbd,.kbd{font-family:var(--mono);font-size:10px;padding:0 4px;border-radius:4px;border:1px solid var(--border-in);color:var(--t2);background:var(--bg)}
.btn.pri kbd{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.15);color:var(--on-accent)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:#86efac}.pill.warn{background:var(--warn-bg);color:#fde047}.pill.danger{background:var(--danger-bg);color:#fca5a5}
.pill.hand{background:var(--accent-m);color:var(--accent-h)}.pill.gray{background:var(--overlay);color:var(--t2)}.pill.blue{background:var(--blue-bg);color:#93c5fd}.pill.purple{background:var(--purple-bg);color:#d8b4fe}

/* ---------- tokens (a ticket on the floor) ---------- */
.tok{position:relative;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font:700 11px var(--mono);color:#0b0b0d;flex:none;
  box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .25s}
.tok[data-ty=build]{background:var(--ty-build)}.tok[data-ty=fix]{background:var(--ty-fix)}.tok[data-ty=review]{background:var(--ty-review)}
.tok[data-ty=ops]{background:var(--ty-ops)}.tok[data-ty=lead]{background:var(--ty-lead)}.tok[data-ty=think]{background:var(--ty-think)}
.tok.sel{outline:2px solid var(--t1);outline-offset:2px}
.tok .mark{position:absolute;right:-5px;bottom:-5px;width:13px;height:13px;border-radius:50%;font:700 9px var(--sans);display:grid;place-items:center;color:#0b0b0d;border:1.5px solid var(--bg)}
.tok .mark.q{background:var(--warn)}.tok .mark.f{background:var(--danger);color:#fff}
.tok.run::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:2px solid transparent;border-top-color:var(--t1);animation:spin 1s linear infinite}
.tok.lg{width:34px;height:34px;border-radius:9px;font-size:14px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- factory floor ---------- */
.factory{flex:1;min-width:0;position:relative;overflow:hidden;
  background:radial-gradient(circle at 50% 42%,rgba(255,255,255,.035),transparent 55%),radial-gradient(circle,rgba(255,255,255,.13) 1px,transparent 1.4px) 0 0/26px 26px,var(--surface)}
.factory::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 45%,rgba(0,0,0,.5))}
.fhead{position:absolute;z-index:3;top:0;left:0;right:0;display:flex;align-items:center;gap:12px;padding:10px var(--gut-r) 10px 16px;background:linear-gradient(var(--glass),transparent)}
.fhead h1{margin:0;font-size:15px;font-weight:650}
.fhead .note{color:var(--t3);font-size:11.5px}
.stage{position:absolute;z-index:1;left:0;top:0;transform-origin:0 0}
.m{position:absolute;top:150px;height:150px;border-radius:14px;background:var(--overlay);border:1.5px solid var(--border-in);padding:22px 12px 10px;
  box-shadow:5px 9px 22px rgba(0,0,0,.55);transition:left .45s cubic-bezier(.2,.8,.2,1),opacity .3s}
.m::before{content:"";position:absolute;inset:-70px;border-radius:50%;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s}
.m.g-run::before{opacity:1;background:radial-gradient(circle,rgba(34,197,94,.2),transparent 68%)}
.m.g-call::before{opacity:1;background:radial-gradient(circle,rgba(234,179,8,.2),transparent 68%)}
.m.g-fail::before{opacity:1;background:radial-gradient(circle,rgba(239,68,68,.22),transparent 68%)}
.m .bar{position:absolute;top:9px;left:22%;right:22%;height:4px;border-radius:2px;background:var(--t4)}
.m.g-run .bar{background:var(--ok)}.m.g-call .bar{background:var(--warn)}.m.g-fail .bar{background:var(--danger)}
.m .nm{font-weight:650;font-size:13.5px;text-align:center}
.m .kd{font-size:10.5px;color:var(--t3);text-align:center;margin-bottom:8px}
.m .slots{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;background:rgba(0,0,0,.34);border-radius:9px;padding:9px 8px;min-height:58px;align-content:flex-start}
.m.gate{border:2.5px dashed var(--warn)}
.m.zone{background:var(--bg);top:118px;height:214px;border-color:var(--accent);border-style:dashed}
.m.exit{border-color:var(--ok);background:var(--overlay)}.m.exit .nm{color:#4ade80;margin-top:34px}
.m.proposed{border-color:var(--accent);animation:pulse 1.3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px var(--accent-m),5px 9px 22px rgba(0,0,0,.55)}}
.lifted{position:absolute;top:-52px;left:0;right:0;display:flex;gap:10px;justify-content:center}
.lifted .tok{transform:translateY(-2px);box-shadow:0 12px 14px rgba(0,0,0,.6),0 0 0 3px var(--accent-m),0 0 0 1.5px var(--accent)}
.lifted .lab{position:absolute;top:-17px;font-size:10px;color:var(--accent-h);font-weight:600;white-space:nowrap}
.belt{position:absolute;top:211px;height:28px;border-radius:5px;background:#2a2a2e;border:1px solid #3a3a40;overflow:hidden;transition:left .45s cubic-bezier(.2,.8,.2,1),width .45s}
.belt::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(161,161,170,.55) 9px 11px,transparent 11px 18px);-webkit-mask:linear-gradient(#000,#000);animation:belt 1.1s linear infinite}
@keyframes belt{to{background-position:18px 0}}
.arm{position:absolute;top:216px;width:18px;height:18px;border-radius:50%;background:var(--bg);border:3.5px solid #c7c7cf;transition:left .45s cubic-bezier(.2,.8,.2,1)}
.loop{position:absolute;border:2px dashed #55555e;border-radius:14px;pointer-events:none;transition:left .45s cubic-bezier(.2,.8,.2,1),width .45s}
.loop.up{top:92px;height:58px;border-bottom:0;border-radius:14px 14px 0 0}
.loop.down{top:300px;height:50px;border-top:0;border-radius:0 0 14px 14px}
.loop span{position:absolute;left:50%;transform:translateX(-50%);font:600 10.5px var(--mono);background:#2b2410;color:#fde047;padding:1px 7px;border-radius:5px}
.loop.up span{top:-10px}.loop.down span{bottom:-10px}
.dock{position:absolute;z-index:3;left:16px;right:var(--gut-r);bottom:16px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) minmax(0,1.15fr);gap:10px;align-items:end}
.dock .card{max-height:min(236px,34vh);overflow:auto}
.card{background:var(--glass);border:1px solid var(--border);border-radius:10px;padding:10px 12px}
.card h2{margin:0 0 6px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:6px;width:100%;text-align:left;min-width:0}
button.row:hover{background:var(--hover)}
.row .tt{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{color:var(--t3);font-size:11px}
.selcard{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.selcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-left:auto}
.propbar{position:absolute;z-index:4;left:50%;top:72px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--accent);border-radius:10px;padding:8px 12px;max-width:calc(100% - 32px);flex-wrap:wrap}

/* ---------- workbench host inside the factory ---------- */
.scrim{position:absolute;inset:0;z-index:5;background:var(--scrim)}
.bench{position:absolute;z-index:6;top:0;bottom:0;right:0;width:min(1260px,calc(100% - 84px));background:var(--bg);border-left:1px solid var(--border-in);display:flex;flex-direction:column;box-shadow:-18px 0 40px rgba(0,0,0,.5)}
.bench.in{animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(40px);opacity:.4}}
.benchbar{flex:none;display:flex;align-items:center;gap:10px;height:38px;padding:0 var(--gut-r) 0 10px;border-bottom:1px solid var(--border);background:var(--surface)}
.benchbar .sp{flex:1}
@media (prefers-reduced-motion:reduce){.bench.in,.m.proposed,.belt::before,.tok.run::after{animation:none}}

/* ---------- work view ---------- */
.work{flex:1;min-width:0;display:flex}
.queue{flex:none;width:288px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.queue header{height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
.queue .list{overflow:auto;padding:6px}
.queue .sec{display:flex;gap:6px;align-items:center;padding:10px 6px 4px}
.qrow{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px;border-left:2px solid transparent}
.qrow:hover{background:var(--hover)}.qrow.on{background:var(--accent-m);border-left-color:var(--accent)}
.qrow .l1{display:flex;gap:6px;align-items:center;font-weight:500}.qrow .l1 span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .l2{font-size:11px;color:var(--t3);padding-left:20px;display:flex;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:2px;flex:none}

/* ---------- the workbench surface (the same in both hosts) ---------- */
.surface{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:7px var(--gut-r) 7px 12px;border-bottom:1px solid var(--border);background:#131316;flex-wrap:wrap;position:relative}
.strip.hand{background:linear-gradient(90deg,var(--accent-m),transparent 70%),#131316}
.path{display:flex;align-items:center;gap:2px;font-size:11.5px;flex-wrap:wrap}
.path .st{padding:2px 7px;border-radius:5px;color:var(--t4);white-space:nowrap}
.path .st.done{color:var(--t2)}.path .st.done::before{content:"✓ ";color:var(--ok)}
.path .st.cur{background:var(--overlay);color:var(--t1);font-weight:600}
.path .st.cur.run{box-shadow:inset 0 -2px 0 var(--ok)}.path .st.cur.call{box-shadow:inset 0 -2px 0 var(--warn)}.path .st.cur.fail{box-shadow:inset 0 -2px 0 var(--danger)}.path .st.cur.hand{box-shadow:inset 0 -2px 0 var(--accent);background:var(--accent-m)}
.path .sep{color:var(--t4)}
.strip .say{flex:1;min-width:160px;color:var(--t2);font-size:12px}.strip .say b{color:var(--t1);font-weight:600}
.strip .acts{display:flex;gap:6px;flex-wrap:wrap}
.pop{position:absolute;z-index:20;right:var(--gut-r);top:calc(100% - 2px);width:330px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border-in);border-radius:10px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.pop h3{margin:6px 8px 2px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--t3);font-weight:600}
.pop button{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px}.pop button:hover{background:var(--hover)}
.pop button small{display:block;color:var(--t3);font-size:11px}
.topbar{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 var(--gut-r) 0 12px;border-bottom:1px solid var(--border);overflow:hidden}
.seg{display:flex;border:1px solid var(--border-in);border-radius:7px;padding:2px;gap:2px}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--t2);display:flex;gap:5px;align-items:center}
.seg button[aria-pressed=true]{background:var(--accent-m);color:var(--accent-h)}
.ib{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--t2);font:600 11px var(--mono);border:1px solid var(--border)}
.ib:hover{background:var(--hover);color:var(--t1)}
.wt{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font:500 11px var(--mono);color:var(--t2)}
.body{flex:1;min-height:0;display:flex}
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.thead{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border)}
.thead b{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream{flex:1;min-height:0;overflow:auto;padding:16px}
.stream .col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.desc{border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--t2)}
.me{align-self:flex-end;max-width:80%;background:var(--accent-m);border-radius:12px 12px 3px 12px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.me .at,.ag .at{color:var(--accent-h);font-family:var(--mono);font-size:12px}
.ag{display:flex;gap:9px;max-width:92%}.ag .av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--purple-bg);color:var(--purple);display:grid;place-items:center}
.ag .who{font-size:11px;color:var(--t3)}.ag .txt{overflow-wrap:anywhere}
.run{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;flex-wrap:wrap}
.run .p{color:var(--purple)}.run .meta{color:var(--t3);font:11px var(--mono)}.run .sp{flex:1}
.run .state{font-weight:600}.run .state.running{color:var(--accent-h)}.run .state.failed{color:#fca5a5}.run .state.interrupted{color:#fde047}
.run .state.running::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.3}}
.deliv{border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev{align-self:center;color:var(--t3);font-size:11px;text-align:center}.ev::before{content:"✓ ";color:var(--ok)}.ev.hand::before{content:"◆ ";color:var(--accent)}
.sug{border:1px solid var(--accent);background:var(--accent-m);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sug p{margin:0;flex:1;min-width:200px}
.composer{flex:none;border-top:1px solid var(--border);padding:10px 12px;position:relative}
.composer .box{display:flex;gap:8px;align-items:flex-end;max-width:760px;margin:0 auto}
.composer textarea{flex:1;min-width:0;resize:none;height:58px;background:var(--surface);border:1px solid var(--border-in);border-radius:9px;padding:8px 10px;outline:none}
.composer textarea:focus{border-color:var(--accent)}
.send{flex:none;height:36px;min-width:36px;padding:0 12px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:650}
.send:hover{background:var(--accent-h)}
.exec{max-width:760px;margin:6px auto 0;display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--t3);flex-wrap:wrap}
.exec select{background:var(--surface);border:1px solid var(--border-in);border-radius:6px;height:22px;font-size:11.5px}
.hint{max-width:760px;margin:0 auto 6px;font-size:11.5px;color:var(--t2);display:flex;gap:8px;align-items:center}
.hint.warn{color:#fde047}
.mmenu{position:absolute;bottom:calc(100% - 6px);left:max(12px,calc(50% - 380px));width:320px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border-in);border-radius:10px;padding:5px;box-shadow:0 -12px 30px rgba(0,0,0,.5);z-index:15}
.mmenu button{display:flex;width:100%;gap:8px;padding:6px 8px;border-radius:6px;text-align:left;align-items:baseline}
.mmenu button:hover,.mmenu button.on{background:var(--hover)}
.mmenu button span:first-child{font-family:var(--mono);font-size:12px}.mmenu button small{color:var(--t3);margin-left:auto;text-align:right}
.mmenu button.off{opacity:.55}
.rpanel{flex:none;width:300px;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.rpanel .ttl{flex:none;height:36px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border)}
.rpanel .in{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:6px 8px;align-items:center}.kv span:nth-child(odd){color:var(--t3);font-size:11.5px}
.tools{flex:none;width:60px;border-left:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;overflow:auto;padding-right:env(safe-area-inset-right,0px)}
.tools button{width:52px;padding:6px 0 4px;border-radius:7px;display:grid;justify-items:center;gap:2px;font-size:10px;color:var(--t3);position:relative}
.tools button:hover{background:var(--hover);color:var(--t1)}.tools button[aria-pressed=true]{background:var(--accent-m);color:var(--accent-h)}
.tools .bdg{position:absolute;top:2px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--accent);color:var(--on-accent);font:700 9.5px var(--sans);display:grid;place-items:center;padding:0 4px}
.tools hr{width:36px;border:0;border-top:1px solid var(--border);margin:6px 0}
.tools .ico{font:600 13px var(--mono)}
.drawer{flex:none;border-top:1px solid var(--border);background:var(--surface);padding:10px 14px;overflow:auto;max-height:150px}
.frise{display:flex;gap:3px;align-items:stretch;min-width:max-content}
.frise div{padding:6px 10px;border-radius:6px;background:var(--overlay);font-size:11px;white-space:nowrap}
.frise div small{display:block;color:var(--t3)}.frise .hand{background:var(--accent-m);color:var(--accent-h)}.frise .now{background:none;border:1px dashed var(--border-in);color:var(--t3)}
.status{flex:none;height:26px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 var(--gut-r) 0 12px;font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden}
.term{flex:1;min-height:0;background:#050506;font:12.5px/1.55 var(--mono);padding:12px 16px;overflow:auto;white-space:pre-wrap}
.term .p{color:var(--ok)}.term input{background:none;border:0;outline:none;width:60%;font:inherit;color:var(--t1)}
.code{flex:1;min-height:0;display:flex}.code .tree{flex:none;width:200px;border-right:1px solid var(--border);padding:10px;font:12px var(--mono);color:var(--t2);overflow:auto}
.code pre{flex:1;margin:0;padding:12px 16px;font:12.5px/1.6 var(--mono);overflow:auto;color:var(--t2)}
.add{color:#86efac}.del{color:#fca5a5}
.dlg{position:absolute;inset:0;z-index:30;background:var(--scrim);display:grid;place-items:center;padding:16px}
.dlg>div{width:min(460px,100%);background:var(--surface);border:1px solid var(--border-in);border-radius:12px;padding:16px}
.dlg h3{margin:0 0 6px;font-size:15px}.dlg p{margin:0 0 14px;color:var(--t2)}.dlg .acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.empty{flex:1;display:grid;place-items:center;color:var(--t3)}

/* ---------- toast (Fleex has one, bottom-centre) and the guide ---------- */
#toast{position:fixed;z-index:60;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--overlay);border:1px solid var(--border-in);border-radius:10px;padding:8px 12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(0,0,0,.55)}
#toast button{color:var(--accent-h);font-weight:600}
#guide{position:fixed;z-index:50;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(40px + env(safe-area-inset-bottom,0px));width:316px;max-width:calc(100% - 24px);background:#101013;border:1px solid var(--border-in);border-radius:12px;box-shadow:0 18px 40px rgba(0,0,0,.6);font-size:12px}
#guide header{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:pointer}
#guide header b{flex:1}
#guide ol{margin:0;padding:0 12px 10px 12px;list-style:none;display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto}
#guide li{display:flex;gap:8px;color:var(--t2)}#guide li::before{content:"○";color:var(--t4);flex:none}
#guide li.done{color:var(--t4)}#guide li.done::before{content:"●";color:var(--ok)}
#guide code{font-family:var(--mono);color:var(--accent-h);font-size:11.5px}
#guide p{margin:0;padding:0 12px 10px;color:var(--t3);font-size:11px}

@media (max-width:900px){.rpanel,.queue,.dock .card:not(.selcard){display:none}.dock{grid-template-columns:minmax(0,1fr)}.bench{width:100%}#guide{width:260px}}
@media (max-width:560px){.tools{display:none}.rail{width:48px}.fhead .note{display:none}}
</style>

<div id="app">
  <nav class="rail" aria-label="Fleex">
    <div class="logo" aria-hidden="true">F</div>
    <button type="button" data-a="view" data-v="work" id="nav-work"><span class="mono" aria-hidden="true">▤</span>Work</button>
    <button type="button" data-a="view" data-v="factory" id="nav-factory"><span class="mono" aria-hidden="true">▦</span>Factory</button>
    <button type="button" class="dim" tabindex="-1"><span class="mono" aria-hidden="true">◫</span>Tasks</button>
    <button type="button" class="dim" tabindex="-1"><span class="mono" aria-hidden="true">◔</span>Focus</button>
  </nav>
  <div id="main"></div>
</div>
<div id="toast" role="status" hidden></div>
<aside id="guide" aria-label="Guide de la maquette"></aside>

<script>
/* ============================================================ data (all simulated) ============================================================ */
const MACH = {
  inbound: { name: 'Inbound', kind: 'zone', sub: 'tickets handed over land here' },
  spec:    { name: 'Spec', kind: 'agent', ref: 'catalyst', outs: ['ok'] },
  check:   { name: 'Check spec', kind: 'gate', outs: ['approve', 'reject'] },
  build:   { name: 'Build', kind: 'agent', ref: 'builder', outs: ['ok'] },
  qa:      { name: 'QA checklist', kind: 'skill', ref: 'qa-checklist', outs: ['ok'] },
  review:  { name: 'Review', kind: 'gate', outs: ['merge', 'changes'] },
  exit:    { name: 'Exit', kind: 'exit' },
};
const TYPE = { build: 'B', fix: 'F', think: 'T', lead: 'L', ops: 'O', review: 'R' };
let clock = 0; const uid = () => 'x' + (++clock);
const T = [
  { id: 't105', num: 105, title: 'Import Linear issues', ty: 'build', prio: 'high', at: 'check', phase: 'review', age: '2h 30m', board: 'Core product' },
  { id: 't111', num: 111, title: 'Emoji picker crashes on Safari', ty: 'fix', prio: 'urgent', at: 'check', phase: 'review', age: '40m', board: 'Support' },
  { id: 't104', num: 104, title: 'Cost budgets and alerts', ty: 'lead', prio: 'medium', at: 'spec', phase: 'question', age: '25m', board: 'Core product' },
  { id: 't106', num: 106, title: 'SSO redirect loop', ty: 'fix', prio: 'urgent', at: 'build', phase: 'failed', age: '12m', board: 'Support', note: 'The agent returned no usable output' },
  { id: 't131', num: 131, title: 'Implement jev as a native workflow step', ty: 'build', prio: 'medium', at: 'build', phase: 'running', eta: 150, age: '3m', board: 'Core product' },
  { id: 't122', num: 122, title: 'Kanban card flickers', ty: 'fix', prio: 'low', at: 'build', phase: 'wait', age: '6m', board: 'Core product' },
  { id: 't103', num: 103, title: 'Weekly agenda view', ty: 'build', prio: 'high', at: 'review', phase: 'review', age: '1h 05m', board: 'Core product', fav: true },
  { id: 't108', num: 108, title: 'Pricing: per seat or usage?', ty: 'think', prio: 'none', at: 'inbound', phase: 'zone', age: '4h', board: 'Core product' },
  { id: 't109', num: 109, title: 'Slack webhook received twice', ty: 'fix', prio: 'medium', at: 'inbound', phase: 'zone', age: '3h', board: 'Support' },
];
const byId = (id) => T.find((t) => t.id === id);
const DESC = {
  t105: 'Pull issues from Linear into a board: map statuses, keep links back to the source.',
  t111: 'Opening the emoji picker in a comment crashes the tab on Safari 17. Chrome is fine.',
  t104: 'Let a lead set a monthly budget for agent runs and be told before it is reached.',
  t106: 'After SSO login the app bounces between /login and /callback. Started with the last auth release.',
  t131: 'A workflow step that runs jev natively instead of shelling out, with its output as a deliverable.',
  t122: 'Cards flicker when a ticket moves while the column is scrolled.',
  t103: 'A week grid in the agenda, with drag to reschedule.',
  t108: 'Decide how Fleex is priced before the beta ends.',
  t109: 'The same Slack event creates two tickets when the webhook retries.',
};
const ORDER = ['inbound', 'spec', 'check', 'build', 'qa', 'review', 'exit'];
const passed = (t, m) => ORDER.indexOf(m) < ORDER.indexOf(t.at);
function seed(t) {
  const th = [{ k: 'desc', txt: DESC[t.id] }];
  if (passed(t, 'spec') || (t.at === 'spec' && t.phase === 'question')) th.push({ k: 'run', who: 'catalyst', what: 'Spec', state: t.phase === 'question' && t.at === 'spec' ? 'ran' : 'ran', meta: '3m 05s · $0.42' });
  if (passed(t, 'spec')) th.push({ k: 'deliv', type: 'spec', title: 'Spec: ' + t.title, by: 'catalyst', v: 'v2' });
  if (passed(t, 'check')) th.push({ k: 'ev', txt: 'Check spec: approve. Moved to Doing' });
  if (t.id === 't104') th.push({ k: 'agent', who: 'catalyst', txt: 'Before I write the spec: should a budget be set per board or for the whole workspace? Per board is more useful to leads but needs a rule for tickets that move between boards.' });
  if (t.id === 't106') th.push({ k: 'run', who: 'builder', what: 'Build', state: 'failed', meta: '1m 12s · $0.08' });
  if (t.id === 't131') th.push({ k: 'run', who: 'builder', what: 'Build', state: 'running', meta: 'started 3m ago', station: true });
  if (t.id === 't103') { th.push({ k: 'run', who: 'builder', what: 'Build', state: 'ran', meta: '14m 20s · $2.31' }); th.push({ k: 'deliv', type: 'pr', title: 'PR: Weekly agenda view', by: 'builder', v: 'v1' }); }
  t.thread = th; t.manual = []; t.hand = null; t.draft = '';
}
T.forEach(seed);
/* what was done by hand this week, per (what, station): the seed of the learning loop */
const MANUAL = [
  { what: 'skill:qa-checklist', at: 'build', n: 5, mins: 22 },
  { what: 'agent:builder', at: 'build', n: 3, mins: 41 },
  { what: 'agent:catalyst', at: 'spec', n: 2, mins: 9 },
];
const MENTIONS = [
  { k: 'agent:builder', d: 'agent' }, { k: 'agent:catalyst', d: 'agent' }, { k: 'agent:reviewer', d: 'agent' },
  { k: 'skill:qa-checklist', d: 'skill' }, { k: 'skill:commit', d: 'skill' }, { k: 'panel:squad', d: 'panel' },
  { k: 'workflow:deploy', d: 'workflow', off: 'on the floor, lay it as a plan' }, { k: 'ticket:378', d: 'ticket' },
];
const REPLY = {
  'skill:qa-checklist': 'QA checklist: 7 of 8 pass. Failing: the empty state overlaps the header under 400 px. Everything else holds, keyboard navigation included.',
  'skill:commit': 'Committed on the ticket branch: "fix: stop the card from re-mounting on move" (3 files, +41 −12).',
  'agent:builder': 'Done. The loop came from the callback route re-reading a stale session cookie; I read it once and pass it down. 3 files changed (+84 −12), tests added for both providers.',
  'agent:catalyst': 'I rewrote the open point as two options with their cost, and recommended per board with a workspace fallback.',
  'agent:reviewer': 'Two remarks: the retry has no upper bound, and the new helper duplicates one in lib/dates. Nothing blocking.',
  'panel:squad': 'Synthesis of the panel: ship it, with the retry bound added first.',
};

const S = { view: 'factory', open: null, justOpened: false, sel: 't105', workSel: 't105', mode: 'chat', tool: 'context', timeline: false, putback: false, dialog: null,
  qa: null /* null | 'proposed' | 'kept' */, suggested: false, mm: null, toast: null, guideOpen: false, done: {} };

/* ============================================================ rules ============================================================ */
const line = () => ORDER.filter((m) => m !== 'qa' || S.qa);
const nextOf = (m, out) => m === 'inbound' ? 'spec' : m === 'spec' ? 'check' : m === 'check' ? (out === 'reject' ? 'spec' : 'build')
  : m === 'build' ? (S.qa ? 'qa' : 'review') : m === 'qa' ? 'review' : m === 'review' ? (out === 'changes' ? 'build' : 'exit') : 'exit';
const needs = (t) => !t.hand && (t.phase === 'review' || t.phase === 'question' || t.phase === 'failed');
const calls = () => T.filter((t) => !t.gone && needs(t));
const cur = () => byId(S.view === 'factory' ? S.open : S.workSel);
const stateOf = (m) => { const a = T.filter((t) => !t.gone && !t.hand && t.at === m); return a.some((t) => t.phase === 'failed') ? 'fail' : a.some((t) => t.phase === 'review' || t.phase === 'question') ? 'call' : a.some((t) => t.phase === 'running') ? 'run' : ''; };
const mark = (k) => { if (!S.done[k]) { S.done[k] = true; guide(); } };

function arrive(t, m, why) {
  t.at = m; t.age = 'now'; t.note = ''; const k = MACH[m].kind;
  if (k === 'exit') { t.gone = true; t.phase = 'done'; t.thread.push({ k: 'ev', txt: 'Reached Exit. Moved to Done' }); toast(`#${t.num} shipped`); if (S.open === t.id) S.open = null; if (S.sel === t.id) S.sel = null; return; }
  t.phase = k === 'gate' ? 'review' : k === 'zone' ? 'zone' : 'wait';
  if (why) t.thread.push({ k: 'ev', txt: why });
}
function startRuns() { /* one run at a time per station, as a station with a small capacity would */
  for (const m of line()) { const k = MACH[m].kind; if (k !== 'agent' && k !== 'skill') continue;
    const here = T.filter((t) => !t.gone && !t.hand && t.at === m);
    if (here.some((t) => t.phase === 'running')) continue;
    const w = here.find((t) => t.phase === 'wait'); if (!w) continue;
    w.phase = 'running'; w.eta = k === 'skill' ? 5 : 9;
    w.thread.push({ k: 'run', who: MACH[m].ref, what: MACH[m].name, state: 'running', meta: 'started just now', station: true, id: uid() });
  }
}
function finishStation(t) {
  const r = [...t.thread].reverse().find((x) => x.k === 'run' && x.station && x.state === 'running'); if (r) { r.state = 'ran'; r.meta = '9s · $0.31'; }
  const from = t.at; arrive(t, nextOf(from, 'ok'), `${MACH[from].name}: ok`);
}
setInterval(() => {
  let changed = false;
  for (const t of T) {
    if (t.gone) continue;
    if (!t.hand && t.phase === 'running' && --t.eta <= 0) { finishStation(t); changed = true; }
    for (const r of t.thread) if (r.k === 'run' && r.manual && r.state === 'running' && --r.eta <= 0) { endManual(t, r); changed = true; }
  }
  const before = T.filter((t) => t.phase === 'running').length; startRuns(); if (T.filter((t) => t.phase === 'running').length !== before) changed = true;
  if (changed) render();
}, 1000);

/* ---------- the clutch ---------- */
function take(t, quiet) {
  if (t.hand) return;
  t.hand = { from: t.at, phase: t.phase, eta: t.eta, at: Date.now() }; t.phase = 'hand'; S.putback = false;
  t.thread.push({ k: 'ev', hand: true, txt: `Taken in hand at ${MACH[t.at].name}. The machines leave it alone` });
  if (!quiet) toast(`#${t.num} is in your hands`, 'Undo', () => undoTake(t));
  mark('take');
}
function undoTake(t) {
  if (!t.hand) return;
  t.thread = t.thread.filter((x) => !(x.k === 'run' && x.manual && x.state === 'running') && !(x.k === 'ev' && x.hand && x.txt.startsWith('Taken')));
  t.phase = t.hand.phase; t.eta = t.hand.eta; t.hand = null; render();
}
function putBack(t, how, arg) {
  const from = t.hand.from; t.hand = null; S.putback = false;
  if (how === 'resume') { arrive(t, from); t.thread.push({ k: 'ev', hand: true, txt: `Put back at ${MACH[from].name}: it takes the ticket again, with what you did` }); }
  else if (how === 'as') { const to = nextOf(from, arg); t.thread.push({ k: 'ev', hand: true, txt: `Put back as ${MACH[from].name}: ${arg}, done by hand` }); arrive(t, to); mark('putback'); }
  else { t.thread.push({ k: 'ev', hand: true, txt: `Put back on the line at ${MACH[arg].name}` }); arrive(t, arg); }
  if (!t.gone) toast(`#${t.num} is back on the line at ${MACH[t.at].name}`);
  startRuns(); render();
}
function manualRun(t, what, text) {
  t.thread.push({ k: 'me', txt: text });
  t.thread.push({ k: 'run', who: what.split(':')[1], what: 'by hand', state: 'running', meta: 'started just now', manual: true, key: what, eta: 4, id: uid() });
  t.draft = ''; S.mm = null;
}
function endManual(t, r) {
  r.state = 'ran'; r.meta = '4s · $0.12';
  t.thread.push({ k: 'agent', who: r.who, txt: REPLY[r.key] || 'Done.' });
  const st = t.hand ? t.hand.from : t.at; t.manual.push({ what: r.key, at: st });
  let row = MANUAL.find((x) => x.what === r.key && x.at === st); if (!row) { row = { what: r.key, at: st, n: 0, mins: 0 }; MANUAL.push(row); }
  row.n++; row.mins += 4;
  if (row.n >= 5 && r.key.startsWith('skill:') && !S.qa && !S.suggested) { S.suggested = true; t.thread.push({ k: 'sug', row }); }
}
function send(t, replyOnly) {
  const text = t.draft.trim(); if (!text) return;
  const m = /@(agent|skill|panel):([\w-]+)/.exec(text);
  if (/@workflow:/.test(text)) { S.hint = 'A workflow is not started from a comment on a ticket that is in the Factory. Lay it on the floor as a plan (Build › Plan), or drop the ticket where it should start.'; return render(); }
  S.hint = '';
  if (!m) {
    t.thread.push({ k: 'me', txt: text }); t.draft = '';
    if (t.phase === 'question' && !t.hand && !replyOnly) { t.phase = 'wait'; t.thread.push({ k: 'ev', txt: `${MACH[t.at].name} takes the ticket again with your answer` }); startRuns(); mark('reply'); }
    return render();
  }
  const what = m[1] + ':' + m[2];
  if (!t.hand && t.phase === 'running') { S.dialog = { t: t.id, what, text }; return render(); }
  if (!t.hand) { take(t, true); toast(`#${t.num} taken in hand: a run by hand and a station do not share a ticket`, 'Undo', () => undoTake(t)); mark('auto'); }
  manualRun(t, what, text); render();
}
function decide(t, out) { const from = t.at; arrive(t, nextOf(from, out), `${MACH[from].name}: ${out}`); startRuns(); mark('decide'); render(); }
function promote() { S.qa = 'proposed'; S.view = 'factory'; S.open = null; mark('promote'); render(); }

/* ============================================================ rendering ============================================================ */
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rich = (s) => esc(s).replace(/@[\w:-]+/g, (m) => `<span class="at">${m}</span>`);
const tok = (t, cls = '') => `<button type="button" class="tok ${cls} ${!t.hand && t.phase === 'running' ? 'run' : ''} ${S.sel === t.id && S.view === 'factory' ? 'sel' : ''}" data-ty="${t.ty}" data-a="pick" data-t="${t.id}" title="#${t.num} ${esc(t.title)}" aria-label="Ticket ${t.num}: ${esc(t.title)}">${TYPE[t.ty]}${needs(t) ? `<span class="mark ${t.phase === 'failed' ? 'f' : 'q'}">${t.phase === 'failed' ? '!' : '?'}</span>` : ''}</button>`;
const sayPhase = (t) => t.hand ? `in your hands, taken from ${MACH[t.hand.from].name}` : ({ review: 'waiting for your decision', question: 'the agent asked a question', failed: 'the run failed', running: 'running', wait: 'queueing to run', zone: 'waiting', done: 'done' })[t.phase];
const pillOf = (t) => t.hand ? '<span class="pill hand">in your hands</span>' : t.phase === 'failed' ? '<span class="pill danger">run failed</span>' : needs(t) ? '<span class="pill warn">needs you</span>' : t.phase === 'running' ? '<span class="pill ok">running</span>' : `<span class="pill gray">${t.phase === 'zone' ? 'waiting' : 'queueing'}</span>`;

function floor() {
  const order = line(); let x = 40; const pos = {};
  for (const m of order) { const w = m === 'inbound' ? 170 : m === 'exit' ? 120 : 164; pos[m] = { x, w }; x += w + 70; }
  const W = x - 70 + 40; let h = '';
  order.forEach((m, i) => {
    const M = MACH[m], p = pos[m], here = T.filter((t) => !t.gone && t.at === m), g = stateOf(m), st = g ? ' g-' + g : '';
    const up = here.filter((t) => t.hand), down = here.filter((t) => !t.hand);
    h += `<div class="m ${M.kind}${st}${m === 'qa' && S.qa === 'proposed' ? ' proposed' : ''}" style="left:${p.x}px;width:${p.w}px">
      ${M.kind !== 'zone' && M.kind !== 'exit' ? '<div class="bar"></div>' : ''}
      ${up.length ? `<div class="lifted"><span class="lab">in your hands</span>${up.map((t) => tok(t)).join('')}</div>` : ''}
      <div class="nm">${M.name}${M.kind === 'zone' ? ' · ' + down.length : ''}</div>
      ${M.kind === 'exit' ? '<div class="kd">done</div>' : `<div class="kd">${M.kind === 'gate' ? 'gate · ' + M.outs.join(' / ') : M.kind === 'zone' ? M.sub : M.kind + ' · ' + M.ref}</div><div class="slots">${down.map((t) => tok(t)).join('')}</div>`}
    </div>`;
    if (i < order.length - 1) { const a = p.x + p.w, b = pos[order[i + 1]].x; h += `<div class="arm" style="left:${a + 4}px"></div><div class="belt" style="left:${a + 28}px;width:${b - a - 56}px"></div><div class="arm" style="left:${b - 22}px"></div>`; }
  });
  const mid = (m) => pos[m].x + pos[m].w / 2;
  h += `<div class="loop up" style="left:${mid('spec')}px;width:${mid('check') - mid('spec')}px"><span>reject</span></div>`;
  h += `<div class="loop down" style="left:${mid('build')}px;width:${mid('review') - mid('build')}px"><span>changes</span></div>`;
  return { html: h, W };
}

function factoryView() {
  const f = floor(), sel = byId(S.sel), cs = calls();
  const selCard = sel && !sel.gone ? `<div class="card selcard">
      <span class="tok lg" data-ty="${sel.ty}" aria-hidden="true">${TYPE[sel.ty]}</span>
      <div style="min-width:0;flex:1"><div class="row" style="padding:0"><span class="tt"><span class="mono" style="color:var(--t3)">#${sel.num}</span> <b>${esc(sel.title)}</b></span></div>
        <div class="sub" style="color:var(--t3);font-size:11.5px">${MACH[sel.hand ? sel.hand.from : sel.at].name} · ${sayPhase(sel)} · ${sel.prio} · ${sel.board}</div></div>
      <div class="acts">${quick(sel)}<button type="button" class="btn pri" data-a="open" data-t="${sel.id}">Open <kbd>V</kbd></button></div>
    </div>` : `<div class="card selcard"><span style="color:var(--t3)">Click a ticket on the floor. A double-click, or <span class="kbd">V</span>, opens it on the workbench.</span></div>`;
  const prop = S.qa === 'proposed' ? `<div class="propbar"><span><b>Proposed from what you do by hand</b> · Build → QA checklist → Review. Placed like a paste: keep it, or take it back.</span><button type="button" class="btn pri" data-a="keepqa">Keep</button><button type="button" class="btn" data-a="dropqa">Discard</button></div>` : '';
  const bench = S.open ? `<div class="scrim" data-a="close"></div><section class="bench ${S.justOpened ? 'in' : ''}" aria-label="Workbench">
      <div class="benchbar"><button type="button" class="btn ghost" data-a="close">‹ Floor <kbd>Esc</kbd></button>
        <span class="cap">Calls</span><button type="button" class="btn" data-a="call" data-d="-1" ${cs.length ? '' : 'disabled'}>‹ <kbd>K</kbd></button><span class="mono" style="color:var(--t2)">${cs.some((t) => t.id === S.open) ? cs.findIndex((t) => t.id === S.open) + 1 + ' of ' + cs.length : cs.length + ' waiting'}</span><button type="button" class="btn" data-a="call" data-d="1" ${cs.length ? '' : 'disabled'}><kbd>J</kbd> ›</button>
        <span class="sp"></span><span style="color:var(--t3);font-size:11.5px">The Work view, on the floor</span></div>
      ${surface(byId(S.open))}</section>` : '';
  return `<div class="factory">
    <div class="fhead"><h1>Factory</h1><span class="note">Simplified floor: one line, no build mode. The command card and the minimap stay as they are today.</span></div>
    <div class="stage" id="stage" data-w="${f.W}">${f.html}</div>${prop}
    <div class="dock">${selCard}
      <div class="card"><h2><span>Waiting for you</span><span>${cs.length}</span></h2>
        ${cs.map((t) => `<button type="button" class="row" data-a="open" data-t="${t.id}"><span class="tok" data-ty="${t.ty}" aria-hidden="true">${TYPE[t.ty]}</span><span class="tt">#${t.num} ${esc(t.title)}<br><span class="sub">${MACH[t.at].name} · ${sayPhase(t)}</span></span></button>`).join('') || '<div class="sub" style="color:var(--t3)">Nothing waits for you.</div>'}</div>
      <div class="card"><h2><span>By hand this week</span><span>${MANUAL.reduce((a, r) => a + r.n, 0)} runs</span></h2>
        ${MANUAL.map((r) => `<div class="row"><span class="tt"><span class="mono" style="color:var(--accent-h)">@${r.what}</span><br><span class="sub">on tickets at ${MACH[r.at].name} · ${r.n} times · ${r.mins}m</span></span>${r.what === 'skill:qa-checklist' ? (S.qa === 'kept' ? '<span class="pill ok">now a station</span>' : S.qa === 'proposed' ? '<span class="pill hand">proposed</span>' : `<button type="button" class="btn" data-a="promote">Make it a station</button>`) : ''}</div>`).join('')}
        <div class="sub" style="color:var(--t3);font-size:11px;padding:4px">What you still do by hand, and where. Five times the same skill at the same place and the Factory offers the station.</div></div>
    </div>
    ${bench}</div>`;
}
function quick(t) {
  if (t.hand) return '';
  if (t.phase === 'review') return MACH[t.at].outs.map((o, i) => `<button type="button" class="btn ${i ? '' : 'ok'}" data-a="decide" data-t="${t.id}" data-o="${o}">${o}</button>`).join('');
  if (t.phase === 'failed') return `<button type="button" class="btn" data-a="retry" data-t="${t.id}">Run again</button>`;
  if (t.phase === 'zone') return `<button type="button" class="btn" data-a="release" data-t="${t.id}">Release</button>`;
  return '';
}

function workView() {
  const live = T.filter((t) => !t.gone), secs = [
    ['IN YOUR HANDS', 'var(--accent)', live.filter((t) => t.hand)],
    ['NEEDS YOU', 'var(--warn)', live.filter(needs)],
    ['RUNNING', 'var(--ok)', live.filter((t) => !t.hand && (t.phase === 'running' || t.phase === 'wait'))],
    ['IDLE', 'var(--t4)', live.filter((t) => !t.hand && t.phase === 'zone')],
  ];
  const t = byId(S.workSel);
  return `<div class="work"><aside class="queue"><header><span class="cap" style="color:var(--t2)">Tasks</span><span class="mono" style="color:var(--t3)">${live.length}</span></header>
    <div class="list">${secs.filter((s) => s[2].length).map(([n, c, rows]) => `<div class="sec"><span class="dot" style="background:${c}"></span><span class="cap">${n}</span></div>${rows.map((r) => `<button type="button" class="qrow ${r.id === S.workSel ? 'on' : ''}" data-a="wsel" data-t="${r.id}">
        <div class="l1"><span class="dot" style="background:var(--ty-${r.ty})"></span><span>${esc(r.title)}</span><span class="mono" style="color:var(--t4);font-size:11px">#${r.num}</span></div>
        <div class="l2"><span class="mono" aria-hidden="true">▦</span>${MACH[r.hand ? r.hand.from : r.at].name} · ${sayPhase(r)}</div></button>`).join('')}`).join('')}</div></aside>
    ${t && !t.gone ? surface(t) : '<div class="empty">No task selected</div>'}</div>`;
}

function strip(t) {
  const at = t.hand ? t.hand.from : t.at, g = t.hand ? 'hand' : t.phase === 'failed' ? 'fail' : needs(t) ? 'call' : t.phase === 'running' ? 'run' : '';
  const path = line().map((m, i, a) => `<span class="st ${m === at ? 'cur ' + g : ORDER.indexOf(m) < ORDER.indexOf(at) ? 'done' : ''}">${MACH[m].name}</span>${i < a.length - 1 ? '<span class="sep">›</span>' : ''}`).join('');
  let say, acts = '';
  const takeBtn = `<button type="button" class="btn" data-a="take" data-t="${t.id}">Take in hand</button>`;
  if (t.hand) { say = `<b>In your hands.</b> Taken from ${MACH[at].name}; the machines leave it alone until you put it back.`; acts = `<button type="button" class="btn pri" data-a="putmenu" aria-expanded="${S.putback}">Put back ▾</button>`; }
  else if (t.phase === 'review') { say = `<b>${MACH[at].name} waits for your decision.</b>`; acts = quick(t) + takeBtn; }
  else if (t.phase === 'question') { say = `<b>${MACH[at].name} asked you a question.</b> Answer below: the station takes the ticket again.`; acts = takeBtn; }
  else if (t.phase === 'failed') { say = `<b>${MACH[at].name}: the run failed.</b> ${esc(t.note || '')}`; acts = quick(t) + takeBtn; }
  else if (t.phase === 'running') { say = `<b>${MACH[at].name} is running on it.</b>`; acts = takeBtn; }
  else if (t.phase === 'zone') { say = `<b>Waiting in ${MACH[at].name}.</b>`; acts = quick(t) + takeBtn; }
  else { say = `<b>Queueing at ${MACH[at].name}.</b>`; acts = takeBtn; }
  if (S.view === 'work') acts += `<button type="button" class="btn ghost" data-a="showfloor" data-t="${t.id}">Show on floor</button>`;
  const M = MACH[at], pop = t.hand && S.putback ? `<div class="pop" role="menu">
      ${M.kind !== 'zone' ? `<h3>You did the station's job</h3>${M.outs.map((o) => `<button type="button" data-a="put" data-how="as" data-arg="${o}">Leave ${M.name} as <b>${o}</b><small>It goes on to ${MACH[nextOf(at, o)].name}, as if ${M.name} had produced it. Counted as done by hand.</small></button>`).join('')}` : ''}
      <h3>Let the machine redo it</h3><button type="button" data-a="put" data-how="resume">Resume at ${M.name}<small>${M.kind === 'gate' ? 'It waits for a decision again.' : M.kind === 'zone' ? 'It waits there again.' : 'It runs again, with what you did in the thread.'}</small></button>
      <h3>Send it elsewhere</h3>${line().filter((m) => m !== at && m !== 'exit').map((m) => `<button type="button" data-a="put" data-how="to" data-arg="${m}">${MACH[m].name}<small>${MACH[m].kind === 'gate' ? 'gate' : MACH[m].kind === 'zone' ? 'zone' : MACH[m].kind + ' · ' + MACH[m].ref}</small></button>`).join('')}
    </div>` : '';
  return `<div class="strip ${t.hand ? 'hand' : ''}"><span class="mono" style="color:var(--t3)" aria-hidden="true">▦</span><div class="path">${path}</div><div class="say">${say}</div><div class="acts">${acts}</div>${pop}</div>`;
}

function thread(t) {
  return t.thread.map((x) => {
    if (x.k === 'desc') return `<div class="desc">${esc(x.txt)}</div>`;
    if (x.k === 'me') return `<div class="me">${rich(x.txt)}</div>`;
    if (x.k === 'agent') return `<div class="ag"><span class="av" aria-hidden="true">⌬</span><div><div class="who">${x.who}</div><div class="txt">${esc(x.txt)}</div></div></div>`;
    if (x.k === 'run') return `<div class="run"><span class="p">⌬ ${x.who}</span><span class="state ${x.state}">${x.state}</span><span class="pill ${x.manual ? 'hand' : 'gray'}">${x.manual ? 'by hand' : 'station · ' + x.what}</span><span class="sp"></span><span class="meta">${x.meta}</span><span style="color:var(--t3)">view log ›</span></div>`;
    if (x.k === 'deliv') return `<div class="deliv"><span class="pill gray">${x.type}</span><b>${esc(x.title)}</b><span style="color:var(--purple)">${x.by}</span><span class="pill warn">draft</span><span class="mono" style="color:var(--t3)">${x.v}</span><span style="margin-left:auto;color:var(--t3)">open ›</span></div>`;
    if (x.k === 'ev') return `<div class="ev ${x.hand ? 'hand' : ''}">${esc(x.txt)}</div>`;
    if (x.k === 'sug') return S.qa ? '' : `<div class="sug"><p><b>That is ${x.row.n} times this week.</b> You ran <span class="mono">@${x.row.what}</span> by hand on tickets at ${MACH[x.row.at].name}. The Factory can do it for you after ${MACH[x.row.at].name}.</p><button type="button" class="btn pri" data-a="promote">Make it a station</button></div>`;
    return '';
  }).join('');
}

function composer(t) {
  const q = t.phase === 'question' && !t.hand, launch = /@(agent|skill|panel):[\w-]+/.test(t.draft);
  const mm = S.mm != null ? MENTIONS.filter((m) => m.k.includes(S.mm)) : [];
  const menu = mm.length ? `<div class="mmenu" role="listbox">${mm.map((m, i) => `<button type="button" class="${m.off ? 'off' : ''} ${i === 0 ? 'on' : ''}" data-a="mention" data-k="${m.k}"><span>@${m.k}</span><small>${m.off || m.d}</small></button>`).join('')}</div>` : '';
  const hint = S.hint ? `<div class="hint warn">${esc(S.hint)}</div>`
    : launch && !t.hand ? `<div class="hint"><span class="pill hand">by hand</span>Sending this takes the ticket in hand${t.phase === 'running' ? `; ${MACH[t.at].name} is running on it, so you will be asked` : ''}. The line carries on without it until you put it back.</div>`
    : q ? `<div class="hint"><span class="pill warn">question</span>Your answer restarts ${MACH[t.at].name}. No second click.</div>` : '';
  return `<div class="composer">${menu}${hint}<div class="box"><textarea id="draft" aria-label="Message" placeholder="Reply, or @ to bring in agents, skills, panels, workflows, tickets…">${esc(t.draft)}</textarea>
      ${q && !launch ? `<button type="button" class="btn" style="height:36px" data-a="send" data-only="1">Reply only</button><button type="button" class="send" data-a="send">Reply &amp; run again</button>` : `<button type="button" class="send" data-a="send" title="Send (Enter)" aria-label="Send">↑</button>`}</div>
    <div class="exec"><span>Mode : <span class="pill" style="background:var(--teal-bg);color:#5eead4">Talk</span> <span class="kbd">⇧⇥</span></span><label>Model : <select id="model" aria-label="Model"><option>Auto (persona)</option><option>Largest</option><option>Fastest</option></select></label><span style="margin-left:auto;color:var(--t4)">⇧⏎ newline</span></div></div>`;
}

const TOOLS = [['context', '◧', 'Context'], ['diff', '±', 'Diff'], ['docs', '▤', 'Docs'], ['todo', '☑', 'Todo'], ['mentions', '@', 'Mentions'], ['notes', '✎', 'Notes'], ['browser', '◎', 'Browser']];
function rpanel(t) {
  const at = t.hand ? t.hand.from : t.at; let h = '';
  if (S.tool === 'context') h = `<div class="kv"><span>Board</span><b>${t.board}</b><span>Status</span><span class="pill blue" style="justify-self:start">${passed(t, 'check') || at === 'build' || at === 'review' ? 'Doing' : 'Todo'}</span><span>Type</span><span>${t.ty}</span><span>Priority</span><span>${t.prio}</span></div>
      <div><div class="cap" style="margin-bottom:6px">Factory</div><div class="kv"><span>Where</span><b>${MACH[at].name}</b><span>State</span><span>${sayPhase(t)}</span><span>By hand</span><span>${t.manual.length ? t.manual.length + ' run' + (t.manual.length > 1 ? 's' : '') + ' on this ticket' : 'nothing yet'}</span></div></div>
      <div><div class="cap" style="margin-bottom:6px">Repos</div><div class="mono" style="color:var(--t2)">fleex · ticket/${t.num}</div></div>
      <div><div class="cap" style="margin-bottom:6px">Pull requests</div><div style="color:var(--t3)">${t.id === 't103' ? 'PR open · checks green' : 'None yet'}</div></div>`;
  else if (S.tool === 'diff') h = `<div class="mono" style="font-size:12px">packages/web/src/Board.tsx <span class="add">+41</span> <span class="del">−12</span><br><br><span class="del">- key={card.id + column.id}</span><br><span class="add">+ key={card.id}</span><br><span class="add">+ layoutId={card.id}</span></div><div style="color:var(--t3)">The branch diff, as in Work today.</div>`;
  else if (S.tool === 'docs') h = t.thread.filter((x) => x.k === 'deliv').map((x) => `<div class="deliv"><span class="pill gray">${x.type}</span><b>${esc(x.title)}</b></div>`).join('') || '<div style="color:var(--t3)">No deliverable yet.</div>';
  else if (S.tool === 'todo') h = ['Reproduce on Safari 17', 'Write the failing test', 'Check the mobile empty state'].map((x, i) => `<label style="display:flex;gap:8px"><input type="checkbox" id="td${i}" ${i === 0 ? 'checked' : ''}>${x}</label>`).join('');
  else h = `<div style="color:var(--t3)">The ${S.tool} panel is the one Work has today. Not redrawn in this mock-up.</div>`;
  return `<aside class="rpanel"><div class="ttl"><span class="cap" style="color:var(--t2)">${S.tool === 'docs' ? 'Deliverables' : S.tool}</span></div><div class="in">${h}</div></aside>`;
}

function surface(t) {
  if (!t || t.gone) return '<div class="empty">This ticket left the floor.</div>';
  const at = t.hand ? t.hand.from : t.at;
  let center;
  if (S.mode === 'shell') center = `<div class="term" id="term">${S.term || ''}<span class="p">ticket/${t.num} ❯</span> <input id="cmd" aria-label="Command" autocomplete="off" placeholder="bun test, git status, fleex start --workspace qa"></div>`;
  else if (S.mode === 'code') center = `<div class="code"><div class="tree">packages/web/src<br>&nbsp;&nbsp;Board.tsx<br>&nbsp;&nbsp;Card.tsx<br>&nbsp;&nbsp;useDrag.ts</div><pre>export function Card({ card }: Props) {
  // the worktree of ticket/${t.num}, as in Work today
  return &lt;motion.li layoutId={card.id}&gt;…&lt;/motion.li&gt;;
}</pre></div>`;
  else center = `<div class="thead"><b>${esc(t.title)}</b><span class="mono" style="color:var(--t4)">#${t.num}</span><span style="margin-left:auto">${pillOf(t)}</span></div>
    <div class="stream" id="stream"><div class="col">${thread(t)}</div></div>${composer(t)}`;
  const dlg = S.dialog && S.dialog.t === t.id ? `<div class="dlg"><div role="dialog" aria-label="One pilot at a time"><h3>${MACH[t.at].name} is running on this ticket</h3>
      <p>One pilot at a time: a run started by hand would work on the same branch as the station's. Interrupting stops the station's run and puts the ticket in your hands.</p>
      <div class="acts"><button type="button" class="btn" data-a="dlg" data-v="wait">Let it finish</button><button type="button" class="btn pri" data-a="dlg" data-v="cut">Interrupt and take in hand</button></div></div></div>` : '';
  const tl = S.timeline ? `<div class="drawer"><div class="frise">${line().filter((m) => ORDER.indexOf(m) <= ORDER.indexOf(at)).map((m) => `<div class="${m === at ? (t.hand ? 'hand' : '') : ''}">${MACH[m].name}<small>${m === at ? (t.hand ? 'in your hands' : sayPhase(t)) : 'done'}</small></div>`).join('')}${t.manual.map((r) => `<div class="hand">@${r.what}<small>by hand</small></div>`).join('')}<div class="now">now</div></div></div>` : '';
  return `<div class="surface" style="position:relative">${strip(t)}
    <div class="topbar"><span class="cap">Mode</span><div class="seg">${[['chat', 'Chat'], ['shell', 'Shell'], ['code', 'Code']].map(([k, l]) => `<button type="button" data-a="mode" data-v="${k}" aria-pressed="${S.mode === k}">${l}</button>`).join('')}</div>
      <span style="flex:1"></span><button type="button" class="ib" title="New terminal">&gt;_</button><span class="cap">Pinned</span><button type="button" class="ib" title="Boot the stack">▶</button><button type="button" class="ib" title="Logs">≡</button>
      <span class="cap">Ticket</span><button type="button" class="ib" title="Open in editor">⌘</button><span class="cap">Worktrees</span><span class="wt"><span class="dot" style="background:var(--ok);border-radius:50%"></span>ticket/${t.num}</span></div>
    <div class="body"><div class="center">${center}</div>${S.tool ? rpanel(t) : ''}
      <div class="tools">${TOOLS.map(([k, i, l]) => `<button type="button" data-a="tool" data-v="${k}" aria-pressed="${S.tool === k}"><span class="ico" aria-hidden="true">${i}</span>${l}${k === 'docs' && t.thread.some((x) => x.k === 'deliv') ? `<span class="bdg">${t.thread.filter((x) => x.k === 'deliv').length}</span>` : ''}${k === 'todo' ? '<span class="bdg">2</span>' : ''}</button>`).join('')}<hr><button type="button" data-a="timeline" aria-pressed="${S.timeline}"><span class="ico" aria-hidden="true">⟷</span>Timeline</button></div></div>
    ${tl}<div class="status"><span>${t.board} › #${t.num} ${esc(t.title)} › ~/fleex-worktrees/ticket-${t.num}</span><span style="margin-left:auto">${sayPhase(t)}</span><span class="mono">$${(0.42 + t.manual.length * 0.12).toFixed(2)}</span></div>${dlg}</div>`;
}

function render() {
  const main = document.getElementById('main'), ae = document.activeElement, keep = ae && ae.id ? { id: ae.id, s: ae.selectionStart, e: ae.selectionEnd } : null;
  const st = document.getElementById('stream'), stick = !st || st.scrollTop + st.clientHeight >= st.scrollHeight - 30, top = st ? st.scrollTop : 0, n = S.lastCount;
  main.innerHTML = S.view === 'factory' ? factoryView() : workView();
  document.getElementById('nav-work').toggleAttribute('aria-current', false); document.getElementById('nav-factory').toggleAttribute('aria-current', false);
  document.getElementById('nav-' + S.view).setAttribute('aria-current', 'page');
  S.justOpened = false; fit(); place();
  const st2 = document.getElementById('stream'), t = cur();
  if (st2) { S.lastCount = t ? t.id + t.thread.length : ''; st2.scrollTop = stick || n !== S.lastCount ? st2.scrollHeight : top; }
  const term = document.getElementById('term'); if (term) term.scrollTop = term.scrollHeight;
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); if (keep.s != null && el.setSelectionRange) try { el.setSelectionRange(keep.s, keep.e); } catch (e) { /* not a text field */ } } }
}
function fit() { /* the line spans y 76..360 in the stage's own units; centre it in the room between the header and the dock */
  const s = document.getElementById('stage'); if (!s) return;
  const box = s.parentElement, dock = box.querySelector('.dock'), W = +s.dataset.w, top = 52, room = box.clientHeight - top - (dock ? dock.offsetHeight + 28 : 0);
  const k = Math.max(0.4, Math.min(1.25, (box.clientWidth - 16) / W, room / 300));
  s.style.transform = `translate(${Math.max(8, (box.clientWidth - W * k) / 2)}px,${top + Math.max(0, (room - 284 * k) / 2) - 76 * k}px) scale(${k})`;
}
function place() { const g = document.getElementById('guide'), dock = document.querySelector('.factory .dock'); if (g) g.style.bottom = dock && !S.open ? dock.offsetHeight + 28 + 'px' : ''; }
window.addEventListener('resize', () => { fit(); place(); });

let toastTimer = 0, toastAct = null;
function toast(msg, label, act) {
  const el = document.getElementById('toast'); toastAct = act || null;
  el.innerHTML = `<span>${esc(msg)}</span>${label ? `<button type="button" data-a="toastact">${label}</button>` : ''}`; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 5200);
}

const STEPS = [
  ['open', 'Sur le floor, ouvre un ticket : double-clic, ou sélection puis <code>V</code>. C\'est la vue Work, posée sur le floor.'],
  ['calls', '<code>J</code> / <code>K</code> : passe d\'un appel au suivant sans revenir au floor.'],
  ['decide', 'Décide un gate depuis la bande en haut (ex. #105 : approve).'],
  ['reply', 'Sur #104 (question de l\'agent) : réponds, « Reply & run again ».'],
  ['auto', 'Sur #122 : écris <code>@skill:qa-checklist</code> et envoie. Le ticket passe dans tes mains tout seul.'],
  ['putback', 'Remets-le : « Put back », puis « Leave Build as ok ».'],
  ['pilot', 'Sur #131 (Build tourne) : envoie <code>@agent:builder</code>. Un seul pilote à la fois.'],
  ['promote', '« Make it a station » (dans le fil, ou « By hand this week » sur le floor).'],
  ['work', 'Passe sur Work (rail de gauche) : même établi, et la bande de ligne remplace le bandeau.'],
];
function guide() {
  const n = STEPS.filter(([k]) => S.done[k]).length;
  document.getElementById('guide').innerHTML = `<header data-a="guide"><b>À essayer</b><span class="mono" style="color:var(--t3)">${n} / ${STEPS.length}</span><span aria-hidden="true">${S.guideOpen ? '▾' : '▸'}</span></header>
    ${S.guideOpen ? `<ol>${STEPS.map(([k, t]) => `<li class="${S.done[k] ? 'done' : ''}"><span>${t}</span></li>`).join('')}</ol><p>Données simulées. Shell, diff, browser et commentaires simples ne débrayent rien : seuls un run lancé à la main ou « Take in hand » sortent le ticket de la ligne.</p>`
      : `<ol>${STEPS.filter(([k]) => !S.done[k]).slice(0, 1).map(([, t]) => `<li><span>${t}</span></li>`).join('') || '<li class="done"><span>Tout est vu. Le reste se juge en jouant avec.</span></li>'}</ol>`}`;
  place();
}

/* ============================================================ input ============================================================ */
function openBench(id) { S.open = id; S.sel = id; S.justOpened = true; S.putback = false; S.hint = ''; S.mm = null; mark('open'); }
const A = {
  view: (d) => { S.view = d.v; S.putback = false; S.mm = null; if (d.v === 'work') { if (S.open) S.workSel = S.open; mark('work'); } },
  pick: (d) => { const now = Date.now(); if (S.sel === d.t && now - (S.pickAt || 0) < 400) openBench(d.t); S.sel = d.t; S.pickAt = now; },
  open: (d) => openBench(d.t),
  close: () => { S.open = null; S.putback = false; },
  call: (d) => stepCall(+d.d),
  wsel: (d) => { S.workSel = d.t; S.putback = false; S.hint = ''; S.mm = null; },
  showfloor: (d) => { S.view = 'factory'; S.open = null; S.sel = d.t; },
  mode: (d) => { S.mode = d.v; },
  tool: (d) => { S.tool = S.tool === d.v ? null : d.v; },
  timeline: () => { S.timeline = !S.timeline; },
  take: (d) => { const t = byId(d.t); if (t.phase === 'running') S.dialog = { t: t.id }; else take(t); },
  putmenu: () => { S.putback = !S.putback; },
  put: (d) => putBack(cur(), d.how, d.arg),
  decide: (d) => decide(byId(d.t), d.o),
  retry: (d) => { const t = byId(d.t); t.phase = 'wait'; t.note = ''; t.thread.push({ k: 'ev', txt: `${MACH[t.at].name} runs again` }); startRuns(); },
  release: (d) => { const t = byId(d.t); arrive(t, nextOf(t.at), 'Released from ' + MACH[t.at].name); startRuns(); },
  send: (d) => send(cur(), !!d.only),
  mention: (d) => { const t = cur(), el = document.getElementById('draft'); t.draft = t.draft.replace(/@[\w:-]*$/, '@' + d.k + ' '); S.mm = null; setTimeout(() => { const e = document.getElementById('draft'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }); },
  dlg: (d) => { const g = S.dialog, t = byId(g.t); S.dialog = null;
    if (d.v === 'wait') return toast(`Nothing sent. ${MACH[t.at].name} keeps running`);
    const r = [...t.thread].reverse().find((x) => x.k === 'run' && x.station && x.state === 'running'); if (r) { r.state = 'interrupted'; r.meta = 'stopped by you'; }
    take(t, true); mark('pilot'); toast(`${MACH[t.hand.from].name} interrupted. #${t.num} is in your hands`);
    if (g.what) manualRun(t, g.what, g.text); },
  promote: () => promote(),
  keepqa: () => { S.qa = 'kept'; toast('QA checklist is on the line: tickets leaving Build go through it'); },
  dropqa: () => { S.qa = null; for (const t of T) if (t.at === 'qa') t.at = 'review'; toast('Taken back'); },
  guide: () => { S.guideOpen = !S.guideOpen; guide(); },
  toastact: () => { document.getElementById('toast').hidden = true; if (toastAct) toastAct(); },
};
function stepCall(d) { const cs = calls(); if (!cs.length) return; const i = cs.findIndex((t) => t.id === S.open); openBench(cs[(i + d + cs.length) % cs.length].id); mark('calls'); }
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (S.putback && !e.target.closest('.pop')) { S.putback = false; render(); } return; }
  const a = el.dataset.a; if (!A[a]) return;
  if (a === 'pick' && S.view !== 'factory') return;
  A[a](el.dataset); if (a !== 'guide') render();
});
document.addEventListener('input', (e) => {
  if (e.target.id !== 'draft') return;
  const t = cur(); t.draft = e.target.value; const m = /@([\w:-]*)$/.exec(e.target.value.slice(0, e.target.selectionStart));
  const mm = m ? m[1] : null, launchBefore = S.launch; S.launch = /@(agent|skill|panel):[\w-]+/.test(t.draft);
  if (mm !== S.mm || S.launch !== launchBefore || S.hint) { S.mm = mm; S.hint = ''; render(); }
});
document.addEventListener('keydown', (e) => {
  const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName);
  if (e.target.id === 'draft') {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (S.mm != null) { const first = MENTIONS.find((m) => m.k.includes(S.mm)); if (first) { A.mention({ k: first.k }); return render(); } } send(cur()); }
    else if (e.key === 'Escape' && S.mm != null) { S.mm = null; e.stopPropagation(); render(); }
    return;
  }
  if (e.target.id === 'cmd' && e.key === 'Enter') {
    const c = e.target.value.trim(), t = cur(); if (!c) return;
    const out = /test/.test(c) ? ' 42 pass · 0 fail' : /status/.test(c) ? ` On branch ticket/${t.num}\n nothing to commit, working tree clean` : /start/.test(c) ? ' SQLite storage initialized\n Event hub disabled\n server: http://localhost:4111' : ' done';
    S.term = (S.term || '') + `<span class="p">ticket/${t.num} ❯</span> ${esc(c)}\n${out}\n<span style="color:var(--t4)"> the line carries on: a command does not take the ticket in hand</span>\n`; render();
    const el = document.getElementById('cmd'); if (el) el.focus(); return;
  }
  if (typing) return;
  if (e.key === 'Escape') { if (S.dialog) S.dialog = null; else if (S.putback) S.putback = false; else if (S.open) S.open = null; else return; render(); }
  else if (S.view === 'factory' && (e.key === 'v' || e.key === 'V' || e.key === 'Enter') && !S.open && S.sel && !byId(S.sel).gone) { openBench(S.sel); render(); }
  else if (S.view === 'factory' && S.open && (e.key === 'j' || e.key === 'J')) { stepCall(1); render(); }
  else if (S.view === 'factory' && S.open && (e.key === 'k' || e.key === 'K')) { stepCall(-1); render(); }
});

startRuns(); render(); guide();
</script>
