<title>Factory Workbench</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a one-screen desktop app. A window title bar (the Electron margin), a nav rail, then either the Factory
   (header, floor with the "needs you" frames top-left, HUD along the bottom, and the workbench sliding up from the
   bottom over all of it) or the Work view (queue, then the same workbench).
   Single dark look on purpose: it mirrors Fleex's own Ember theme (packages/web/src/index.css). */
:root{
  color-scheme:dark;
  --bg:#09090b;--surface:#18181b;--overlay:#27272a;--hover:rgba(63,63,70,.42);
  --border:#27272a;--border-in:#3f3f46;
  --t1:#fafafa;--t2:#a1a1aa;--t3:#82828b;--t4:#5f5f68;
  --accent:#D77655;--accent-h:#e08868;--accent-m:rgba(215,118,85,.16);--on-accent:#1b0f0a;
  --ok:#22c55e;--ok-bg:rgba(34,197,94,.14);--warn:#eab308;--warn-bg:rgba(234,179,8,.14);--danger:#ef4444;--danger-bg:rgba(239,68,68,.14);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,.15);--blue:#60a5fa;--blue-bg:rgba(96,165,250,.15);--teal:#2dd4bf;--teal-bg:rgba(45,212,191,.14);
  --ty-build:#4ade80;--ty-fix:#f87171;--ty-review:#facc15;--ty-ops:#2dd4bf;--ty-lead:#c084fc;--ty-think:#60a5fa;
  --steel:#2b2b31;--steel-2:#34343b;--steel-edge:#4a4a54;--pit:rgba(0,0,0,.42);--hazard:#eab308;
  --scrim:rgba(0,0,0,.6);--glass:rgba(13,13,16,.72);--toggle-on:#facc15;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --title-h:36px;--hud-h:228px;
  --gut-l:max(16px,env(safe-area-inset-left,0px));--gut-r:max(16px,env(safe-area-inset-right,0px));
}
html,body{height:100%}
body{background:var(--bg);color:var(--t1);font-family:var(--sans);font-size:13px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.cap{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);font-weight:600}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#app{height:100%;display:flex;flex-direction:column;min-width:0}
.tbar{flex:none;height:var(--title-h);display:flex;align-items:center;gap:8px;padding:0 var(--gut-r) 0 max(14px,env(safe-area-inset-left,0px));background:#0d0d10;border-bottom:1px solid var(--border);color:var(--t3);font-size:12px}
.tbar i{width:12px;height:12px;border-radius:50%;background:#3a3a41}.tbar span{margin:0 auto;transform:translateX(-30px)}
.shell{flex:1;min-height:0;display:flex;min-width:0}

/* ---------- nav rail ---------- */
.rail{flex:none;width:56px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:6px;padding-block:10px;padding-left:env(safe-area-inset-left,0px)}
.rail .logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:800;margin-bottom:8px}
.rail button{width:44px;padding:6px 0;border-radius:8px;display:grid;place-items:center;gap:2px;color:var(--t3);font-size:10px}
.rail button .i{font-size:17px}
.rail button:hover{background:var(--hover);color:var(--t1)}
.rail button[aria-current=page]{background:var(--accent-m);color:var(--accent)}
.rail .dim{opacity:.35;pointer-events:none}
#main{flex:1;min-width:0;position:relative;display:flex}

/* ---------- small parts ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;border:1px solid var(--border-in);background:var(--surface);font-size:12px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--overlay)}.btn:disabled{opacity:.45;cursor:default}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}.btn.pri:hover{background:var(--accent-h)}
.btn.ghost{border-color:transparent;background:none;color:var(--t2)}.btn.ghost:hover{background:var(--hover);color:var(--t1)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052e16;font-weight:600}
.kbd{font-family:var(--mono);font-size:10px;padding:0 4px;border-radius:4px;border:1px solid var(--border-in);color:var(--t2);background:var(--bg)}
.btn.pri .kbd{border-color:rgba(0,0,0,.25);background:rgba(0,0,0,.15);color:var(--on-accent)}
.pill{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:999px;font-size:11px;font-weight:500;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:#86efac}.pill.warn{background:var(--warn-bg);color:#fde047}.pill.danger{background:var(--danger-bg);color:#fca5a5}
.pill.hand{background:var(--accent-m);color:var(--accent-h)}.pill.gray{background:var(--overlay);color:var(--t2)}.pill.blue{background:var(--blue-bg);color:#93c5fd}

/* ---------- a ticket on the floor: a token in its type's colour, carrying the type's pictogram ---------- */
.tok{position:relative;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;color:#0b0b0d;flex:none;
  box-shadow:0 2.5px 0 rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.18)}
.tok svg{width:62%;height:62%;fill:currentColor;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.tok[data-ty=build]{background:var(--ty-build)}.tok[data-ty=fix]{background:var(--ty-fix)}.tok[data-ty=review]{background:var(--ty-review)}
.tok[data-ty=ops]{background:var(--ty-ops)}.tok[data-ty=lead]{background:var(--ty-lead)}.tok[data-ty=think]{background:var(--ty-think)}
.tok.sel{outline:2.5px solid var(--t1);outline-offset:2px}
.tok .mark{position:absolute;right:-6px;bottom:-6px;width:15px;height:15px;border-radius:50%;font:800 10px var(--sans);display:grid;place-items:center;color:#0b0b0d;border:2px solid #17171a}
.tok .mark.q{background:var(--warn)}.tok .mark.f{background:var(--danger);color:#fff}.tok .mark.h{background:var(--accent);color:var(--on-accent)}
.tok .mark.h{width:18px;height:18px;right:-8px;bottom:-8px}
.tok .mark svg{width:11px;height:11px;fill:none;stroke-width:2.4}
.tok.big{width:44px;height:44px;border-radius:12px}
.tok.sm{width:18px;height:18px;border-radius:5px;box-shadow:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}

/* ---------- factory ---------- */
.factory{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.fhead{flex:none;height:44px;display:flex;align-items:center;gap:10px;padding:0 var(--gut-r) 0 14px;border-bottom:1px solid var(--border);background:var(--surface)}
.fhead h1{margin:0;font-size:14px;font-weight:650}
.fhead .find{height:26px;width:220px;border:1px solid var(--border-in);border-radius:6px;background:var(--bg);color:var(--t4);display:flex;align-items:center;padding:0 9px;font-size:12px}
.floor{flex:1;min-height:0;position:relative;overflow:hidden;
  background:radial-gradient(circle,rgba(255,255,255,.12) 1px,transparent 1.4px) 0 0/26px 26px,radial-gradient(ellipse at 55% 45%,#1e1e22,#111114 78%)}
.stage{position:absolute;left:0;top:0;transform-origin:0 0;width:900px;height:556px}

/* a station: a machine with a head plate, a stack light, lanes for what queues, runs and waits, and a bay for what was set aside */
.st{position:absolute;border-radius:16px;background:linear-gradient(var(--steel-2),var(--steel));border:1.5px solid var(--steel-edge);
  box-shadow:6px 10px 24px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.07);display:flex;flex-direction:column;padding:8px}
.st::before{content:"";position:absolute;inset:-64px;border-radius:50%;z-index:-1;pointer-events:none;opacity:0;transition:opacity .4s}
.st.g-run::before{opacity:1;background:radial-gradient(circle,rgba(34,197,94,.2),transparent 66%)}
.st.g-call::before{opacity:1;background:radial-gradient(circle,rgba(234,179,8,.2),transparent 66%)}
.st.g-fail::before{opacity:1;background:radial-gradient(circle,rgba(239,68,68,.24),transparent 66%)}
.st.hl{outline:3px solid var(--accent);outline-offset:4px}
.st.pick{cursor:crosshair;outline:2px dashed var(--accent);outline-offset:4px}
.st header{display:flex;align-items:center;gap:8px;padding:0 30px 6px 2px}
.st .badge{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:20px;flex:none;border:1.5px solid}
.st.k-agent .badge{background:var(--purple-bg);color:var(--purple);border-color:rgba(192,132,252,.45)}
.st.k-gate .badge{background:var(--warn-bg);color:#fde047;border-color:rgba(234,179,8,.5)}
.st.k-zone .badge{background:var(--accent-m);color:var(--accent-h);border-color:rgba(215,118,85,.5)}
.st.k-exit .badge{background:var(--ok-bg);color:#4ade80;border-color:rgba(34,197,94,.5)}
.st header b{display:block;font-size:14.5px;line-height:1.15}.st header small{color:var(--t3);font-size:10.5px}
/* the stack light every station carries: what it is doing, read from across the floor */
.andon{position:absolute;top:-13px;right:14px;width:15px;border-radius:5px;background:#101013;border:1.5px solid var(--steel-edge);padding:2.5px;display:grid;gap:2px}
.andon i{height:8px;border-radius:2px;background:#2a2a2f}
.st.g-fail .andon .r{background:var(--danger);box-shadow:0 0 10px 2px rgba(239,68,68,.8);animation:blink 1s steps(2,jump-none) infinite}
.st.g-call .andon .a{background:var(--warn);box-shadow:0 0 10px 2px rgba(234,179,8,.8);animation:blink 1.4s ease-in-out infinite}
.st.g-run .andon .g,.st.has-run .andon .g{background:var(--ok);box-shadow:0 0 10px 2px rgba(34,197,94,.75)}
.lanes{flex:1;min-height:0;display:flex;gap:6px}
.pit{background:var(--pit);border-radius:10px;border:1px solid rgba(255,255,255,.05);position:relative;padding:15px 6px 6px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;justify-content:center}
.pit>label,.side>label{position:absolute;top:3px;left:7px;font:700 8px var(--sans);letter-spacing:.1em;color:var(--t4)}
.pit.in{flex:0 0 38%}
.pit.bay{flex:1;align-content:center;align-items:center}
.bay .rig{position:relative;display:grid;place-items:center;width:64px;height:64px}
.bay .rig::before,.bay .rig::after{pointer-events:none}
.bay .rig::before{content:"";position:absolute;inset:0;border-radius:50%;border:3px dashed rgba(34,197,94,.75);animation:spin 5s linear infinite}
.bay .rig::after{content:"";position:absolute;inset:6px;border-radius:50%;border:3px solid transparent;border-top-color:var(--ok);animation:spin 1.1s linear infinite}
.bay .idle{color:var(--t4);font-size:26px;opacity:.6}
.exits{display:flex;flex-direction:column;gap:4px;justify-content:center;flex:none}
.exits span{font:600 9.5px var(--mono);padding:2px 6px;border-radius:5px;background:#2b2410;color:#fde047;white-space:nowrap}
/* set aside, inside the station: an agent's question, a failed run, a ticket you took in hand. Hazard edge, as a hold area has */
.side{flex:none;margin-top:6px;height:46px;border-radius:10px;position:relative;padding:13px 8px 5px 34px;display:flex;gap:9px;align-items:center;
  background:repeating-linear-gradient(-45deg,rgba(234,179,8,.5) 0 5px,rgba(0,0,0,.5) 5px 10px) 0 0/22px 100% no-repeat,rgba(0,0,0,.5);border:1px solid rgba(234,179,8,.22)}
.side>label{left:30px;color:#a38a2e}
.side.vacant{opacity:.45}
.st.k-zone{border-style:dashed;border-color:var(--accent);background:linear-gradient(#141416,#0c0c0e)}
.st.k-exit{border-color:var(--ok)}.st.k-exit .big{flex:1;display:grid;place-items:center;color:#4ade80;font-size:44px;opacity:.85}
.st.k-exit .cnt{text-align:center;color:var(--t3);font-size:11px;padding-bottom:6px}
.st.k-gate{border:2.5px dashed var(--hazard)}
.belt{position:absolute;border-radius:5px;background:#26262a;border:1px solid #3a3a40;overflow:hidden}
.belt::before{content:"";position:absolute;inset:0;animation:belt 1.1s linear infinite}
.belt.h::before{background:repeating-linear-gradient(90deg,transparent 0 9px,rgba(161,161,170,.55) 9px 11px,transparent 11px 18px)}
.belt.v::before{background:repeating-linear-gradient(180deg,transparent 0 9px,rgba(161,161,170,.55) 9px 11px,transparent 11px 18px);animation-name:beltv}
.belt.rev::before{animation-direction:reverse}
@keyframes belt{to{background-position:18px 0}}@keyframes beltv{to{background-position:0 18px}}
.arm{position:absolute;width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid #c7c7cf;transition:box-shadow .15s,border-color .15s}
.arm.hl{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-m),0 0 18px 4px rgba(215,118,85,.7)}
.loop{position:absolute;border:2px dashed #55555e;pointer-events:none;transition:border-color .15s}
.loop.up{border-bottom:0;border-radius:14px 14px 0 0}.loop.down{border-top:0;border-radius:0 0 14px 14px}
.loop.hl{border-color:var(--accent)}
.loop span{position:absolute;left:50%;transform:translateX(-50%);font:600 10.5px var(--mono);background:#2b2410;color:#fde047;padding:1px 7px;border-radius:5px}
.loop.up span{top:-10px}.loop.down span{bottom:-10px}
.pickbar{position:absolute;z-index:4;left:50%;bottom:12px;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(8px);border:1px solid var(--accent);border-radius:10px;padding:7px 12px;display:flex;gap:10px;align-items:center}

/* ---------- "needs you": the frames of a party, top-left, over the floor ---------- */
.party{position:absolute;z-index:3;top:10px;left:10px;width:268px;max-height:calc(100% - 20px);overflow:auto;display:flex;flex-direction:column;gap:4px}
.party h2{margin:0 0 2px 4px;font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--t2);font-weight:650;text-shadow:0 1px 2px #000}
.pf{display:grid;grid-template-columns:30px 1fr;gap:1px 8px;align-items:center;width:100%;text-align:left;padding:6px 8px 7px;border-radius:9px;
  background:var(--glass);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);border:1px solid rgba(255,255,255,.07);position:relative;overflow:hidden}
.pf:hover{border-color:var(--border-in)}.pf.on{border-color:var(--t1)}
.pf .tok{grid-row:1/3}
.pf .l1{display:flex;gap:6px;align-items:center;min-width:0}.pf .l1 b{font-weight:600;min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf .l2{font-size:11px;display:flex;gap:5px;align-items:center;min-width:0;white-space:nowrap}
.pf .l2 .w{margin-left:auto;color:var(--t3);font-family:var(--mono);font-size:10.5px}
.pf .call{color:#fde047}.pf .fail{color:#fca5a5}.pf .hand{color:var(--accent-h)}
.pf .bar{position:absolute;left:0;bottom:0;height:2.5px;background:var(--warn)}.pf.f .bar{background:var(--danger)}.pf.h .bar{background:var(--accent)}
.prio{display:inline-flex;gap:1.5px;align-items:flex-end;height:11px;flex:none}.prio i{width:3px;border-radius:1px;background:#3f3f46}
.prio i:nth-child(1){height:5px}.prio i:nth-child(2){height:8px}.prio i:nth-child(3){height:11px}
.cx{flex:none;min-width:17px;height:17px;border-radius:50%;border:1.5px solid var(--border-in);font:600 9.5px var(--mono);display:grid;place-items:center;color:var(--t2);padding:0 2px}

/* ---------- micro chat: the first click on a ticket ---------- */
.peek{position:absolute;z-index:4;width:340px;max-width:calc(100% - 20px);background:rgba(18,18,21,.96);border:1px solid var(--border-in);border-radius:12px;box-shadow:0 18px 44px rgba(0,0,0,.65);display:flex;flex-direction:column;max-height:calc(100% - 16px)}
.peek .ph{display:flex;gap:9px;align-items:center;padding:9px 10px 8px;border-bottom:1px solid var(--border)}
.peek .ph b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.peek .ph small{color:var(--t3);font-size:11px}
.peek .pt{overflow:auto;padding:10px;display:flex;flex-direction:column;gap:9px;font-size:12.5px;min-height:60px}
.peek .more{align-self:center;color:var(--t3);font-size:11px}
.peek .pfoot{border-top:1px solid var(--border);padding:8px;display:flex;gap:6px;align-items:center}
.peek input{flex:1;min-width:0;height:28px;border-radius:7px;border:1px solid var(--border-in);background:var(--surface);padding:0 9px;outline:none}
.peek input:focus{border-color:var(--accent)}

/* ---------- HUD ---------- */
.hud{flex:none;height:var(--hud-h);display:flex;gap:8px;padding:8px var(--gut-r) 8px 8px;background:#0c0c0e;border-top:1px solid var(--border)}
.hud>div{border:1px solid var(--border);border-radius:10px;background:var(--bg);padding:8px;min-width:0}
.hmap{flex:none;width:320px;display:grid;grid-template-columns:1fr 104px;grid-template-rows:auto 1fr;gap:6px 8px}
.toggles{display:flex;gap:4px}.toggles button{width:26px;height:22px;border-radius:5px;border:1px solid var(--border-in);display:grid;place-items:center;color:var(--t2);font-size:13px}
.toggles button[aria-pressed=true]{background:var(--toggle-on);border-color:var(--toggle-on);color:#111}
.mini{position:relative;background:#1b1b1f;border-radius:6px;overflow:hidden;min-height:0}
.mini i{position:absolute;border-radius:1.5px;background:#6b6b75}.mini .view{position:absolute;inset:6px;border:1.5px solid #fff;border-radius:2px}
.layers{grid-row:1/3;grid-column:2;display:flex;flex-direction:column;gap:1px;border:1px solid var(--border-in);border-radius:7px;padding:3px;align-self:start;font-size:11px}
.layers span{padding:2.5px 7px;border-radius:5px;color:var(--t3);white-space:nowrap}.layers span:first-child{background:var(--overlay);color:var(--t1)}
.hsel{flex:1;display:flex;flex-direction:column;gap:8px}
.groups{display:flex;gap:4px;border-bottom:1px solid var(--border);padding-bottom:7px}.groups span{width:20px;height:20px;border:1px dashed var(--border-in);border-radius:5px;display:grid;place-items:center;font:10px var(--mono);color:var(--t4)}
.selc{display:flex;gap:12px;align-items:flex-start;min-width:0}
.selc .ic{width:52px;height:52px;border-radius:10px;border:1.5px solid var(--border-in);display:grid;place-items:center;font-size:26px;color:var(--t2);flex:none}
.selc h3{margin:0;font-size:14.5px}.selc p{margin:2px 0 0;color:var(--t2);font-size:12px}
.selc .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px;color:var(--t3);font-size:11.5px}
.hcmd{flex:none;width:384px;display:flex;flex-direction:column;gap:6px}
.hcmd .grid{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:5px;min-height:0}
.tile{position:relative;border-radius:8px;border:1px solid var(--border-in);background:#1c1c20;display:grid;place-items:center;align-content:center;gap:1px;font-size:11px;font-weight:600;min-height:0;padding:2px}
.tile .i{font-size:17px}.tile .k{position:absolute;top:3px;left:5px;font:600 9px var(--mono);color:inherit;opacity:.75}
.tile:hover{filter:brightness(1.2)}
.tile.none{border-style:dashed;border-color:var(--border);background:none;pointer-events:none}
.tile.go{background:var(--ok);border-color:var(--ok);color:#052e16}.tile.hand{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tile.ticket{background:#1d2140;border-color:#3b4170;color:#c7d0ff}.tile.back{color:var(--t2)}.tile.danger{background:#3a1717;border-color:#6b2323;color:#fca5a5}

/* ---------- the workbench: slides up from the bottom, over the floor and the HUD ---------- */
.scrim{position:fixed;inset:var(--title-h) 0 0 0;z-index:20;background:var(--scrim)}
.bench{position:fixed;z-index:21;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:0;top:calc(var(--title-h) + 26px);
  background:var(--bg);border:1px solid var(--border-in);border-bottom:0;border-radius:14px 14px 0 0;display:flex;flex-direction:column;box-shadow:0 -22px 60px rgba(0,0,0,.65);overflow:hidden}
.bench.in{animation:rise .26s cubic-bezier(.2,.85,.25,1)}
@keyframes rise{from{transform:translateY(46%);opacity:.3}}
.benchbar{flex:none;display:flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-bottom:1px solid var(--border);background:var(--surface);position:relative}
.benchbar::before{content:"";position:absolute;top:4px;left:50%;width:44px;height:4px;margin-left:-22px;border-radius:2px;background:var(--border-in)}
.seg{display:flex;border:1px solid var(--border-in);border-radius:7px;padding:2px;gap:2px;flex:none}
.seg button{height:22px;padding:0 9px;border-radius:5px;font-size:12px;color:var(--t2);display:flex;gap:5px;align-items:center;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--accent-m);color:var(--accent-h)}
.chips{flex:1;min-width:0;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{flex:none;display:flex;align-items:center;gap:6px;height:26px;padding:0 9px 0 5px;border-radius:7px;border:1px solid var(--border);font-size:11.5px;color:var(--t2);max-width:210px}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.on{border-color:var(--t1);color:var(--t1);background:var(--overlay)}
@media (prefers-reduced-motion:reduce){.bench.in,.belt::before,.bay .rig::before,.bay .rig::after,.andon i{animation:none!important}}

/* ---------- work view ---------- */
.work{flex:1;min-width:0;display:flex}
.queue{flex:none;width:288px;border-right:1px solid var(--border);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.queue header{height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--border)}
.queue .list{overflow:auto;padding:6px}
.queue .sec{display:flex;gap:6px;align-items:center;padding:10px 6px 4px}
.qrow{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:6px;border-left:2px solid transparent}
.qrow:hover{background:var(--hover)}.qrow.on{background:var(--accent-m);border-left-color:var(--accent)}
.qrow .l1{display:flex;gap:7px;align-items:center;font-weight:500}.qrow .l1 span:nth-child(2){flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .l2{font-size:11px;color:var(--t3);padding-left:25px}
.dot{width:8px;height:8px;border-radius:2px;flex:none}

/* ---------- the workbench surface (the same in both hosts) ---------- */
.surface{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;background:var(--bg);position:relative}
.strip{flex:none;display:flex;align-items:center;gap:10px;padding:7px var(--gut-r) 7px 12px;border-bottom:1px solid var(--border);background:#131316;flex-wrap:wrap;position:relative}
.strip.hand{background:linear-gradient(90deg,var(--accent-m),transparent 70%),#131316}
.path{display:flex;align-items:center;gap:2px;font-size:11.5px;flex-wrap:wrap}
.path .s{padding:2px 7px;border-radius:5px;color:var(--t4);white-space:nowrap}
.path .s.done{color:var(--t2)}.path .s.done::before{content:"✓ ";color:var(--ok)}
.path .s.cur{background:var(--overlay);color:var(--t1);font-weight:600}
.path .s.cur.run{box-shadow:inset 0 -2px 0 var(--ok)}.path .s.cur.call{box-shadow:inset 0 -2px 0 var(--warn)}.path .s.cur.fail{box-shadow:inset 0 -2px 0 var(--danger)}.path .s.cur.hand{box-shadow:inset 0 -2px 0 var(--accent);background:var(--accent-m)}
.path .sep{color:var(--t4)}
.strip .say{flex:1;min-width:160px;color:var(--t2);font-size:12px}.strip .say b{color:var(--t1);font-weight:600}
.strip .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pop{position:absolute;z-index:25;right:var(--gut-r);top:calc(100% - 2px);width:250px;background:var(--surface);border:1px solid var(--border-in);border-radius:10px;padding:6px;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.pop button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px}.pop button:hover{background:var(--hover)}.pop button small{color:var(--t3);margin-left:6px}
.topbar{flex:none;height:40px;display:flex;align-items:center;gap:10px;padding:0 var(--gut-r) 0 12px;border-bottom:1px solid var(--border);overflow:hidden}
.ib{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:var(--t2);font:600 11px var(--mono);border:1px solid var(--border);flex:none}
.wt{display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border-radius:6px;border:1px solid var(--border);font:500 11px var(--mono);color:var(--t2);flex:none}
.body{flex:1;min-height:0;display:flex}
.center{flex:1;min-width:0;display:flex;flex-direction:column}
.thead{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--border)}
.thead b{font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stream{flex:1;min-height:0;overflow:auto;padding:16px}
.stream .col{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.desc{border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--t2)}
.me{align-self:flex-end;max-width:80%;background:var(--accent-m);border-radius:12px 12px 3px 12px;padding:8px 12px;white-space:pre-wrap;overflow-wrap:anywhere}
.at{color:var(--accent-h);font-family:var(--mono);font-size:12px}
.ag{display:flex;gap:9px;max-width:92%}.ag .av{flex:none;width:24px;height:24px;border-radius:50%;background:var(--purple-bg);color:var(--purple);display:grid;place-items:center}
.ag .who{font-size:11px;color:var(--t3)}.ag .txt{overflow-wrap:anywhere}
.run{display:flex;align-items:center;gap:8px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;flex-wrap:wrap}
.run .p{color:var(--purple)}.run .meta{color:var(--t3);font:11px var(--mono)}.run .sp{flex:1}
.run .state{font-weight:600}.run .state.running{color:var(--accent-h)}.run .state.failed{color:#fca5a5}.run .state.interrupted{color:#fde047}
.run .state.running::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:6px;animation:blink 1s ease-in-out infinite}
.deliv{border:1px solid var(--border);border-left:2px solid var(--accent);border-radius:8px;padding:7px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev{align-self:center;color:var(--t3);font-size:11px;text-align:center}.ev::before{content:"✓ ";color:var(--ok)}.ev.hand::before{content:"◆ ";color:var(--accent)}
.composer{flex:none;border-top:1px solid var(--border);padding:10px 12px;position:relative}
.composer .box{display:flex;gap:8px;align-items:flex-end;max-width:760px;margin:0 auto}

.composer textarea:focus{border-color:var(--accent)}
.send{flex:none;height:36px;min-width:36px;padding:0 12px;border-radius:9px;background:var(--accent);color:var(--on-accent);font-weight:650}
.send:hover{background:var(--accent-h)}
.exec{max-width:760px;margin:6px auto 0;display:flex;gap:12px;align-items:center;font-size:11.5px;color:var(--t3);flex-wrap:wrap}
.exec select{background:var(--surface);border:1px solid var(--border-in);border-radius:6px;height:22px;font-size:11.5px}
.hint{max-width:760px;margin:0 auto 6px;font-size:11.5px;color:var(--t2);display:flex;gap:8px;align-items:center}
.hint.warn{color:#fde047}
.mmenu{position:absolute;bottom:calc(100% - 6px);left:max(12px,calc(50% - 380px));width:320px;max-width:calc(100% - 24px);background:var(--surface);border:1px solid var(--border-in);border-radius:10px;padding:5px;box-shadow:0 -12px 30px rgba(0,0,0,.5);z-index:15}
.mmenu button{display:flex;width:100%;gap:8px;padding:6px 8px;border-radius:6px;text-align:left;align-items:baseline}
.mmenu button:hover,.mmenu button.on{background:var(--hover)}
.mmenu button span:first-child{font-family:var(--mono);font-size:12px}.mmenu button small{color:var(--t3);margin-left:auto;text-align:right}
.mmenu button.off{opacity:.55}
.rpanel{flex:none;width:300px;border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0;background:var(--surface)}
.rpanel .ttl{flex:none;height:36px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--border)}
.rpanel .in{overflow:auto;padding:10px 12px;display:flex;flex-direction:column;gap:12px}
.kv{display:grid;grid-template-columns:86px 1fr;gap:6px 8px;align-items:center}.kv span:nth-child(odd){color:var(--t3);font-size:11.5px}

.tools hr{width:36px;border:0;border-top:1px solid var(--border);margin:6px 0}
.tools .ico{font:600 13px var(--mono)}
.drawer{flex:none;border-top:1px solid var(--border);background:var(--surface);padding:10px 14px;overflow:auto;max-height:150px}
.frise{display:flex;gap:3px;align-items:stretch;min-width:max-content}
.frise div{padding:6px 10px;border-radius:6px;background:var(--overlay);font-size:11px;white-space:nowrap}
.frise div small{display:block;color:var(--t3)}.frise .hand{background:var(--accent-m);color:var(--accent-h)}.frise .now{background:none;border:1px dashed var(--border-in);color:var(--t3)}
.status{flex:none;height:26px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 var(--gut-r) 0 12px;font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden}
.term{flex:1;min-height:0;background:#050506;font:12.5px/1.55 var(--mono);padding:12px 16px;overflow:auto;white-space:pre-wrap}
.term .p{color:var(--ok)}.term input{background:none;border:0;outline:none;width:60%;font:inherit;color:var(--t1)}
.code{flex:1;min-height:0;display:flex}.code .tree{flex:none;width:200px;border-right:1px solid var(--border);padding:10px;font:12px var(--mono);color:var(--t2);overflow:auto}
.code pre{flex:1;margin:0;padding:12px 16px;font:12.5px/1.6 var(--mono);overflow:auto;color:var(--t2)}
.add{color:#86efac}.del{color:#fca5a5}
.empty{flex:1;display:grid;place-items:center;color:var(--t3)}

/* ---------- toast (Fleex has one, bottom-centre) and the guide ---------- */
#toast{position:fixed;z-index:60;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--overlay);border:1px solid var(--border-in);border-radius:10px;padding:8px 12px;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px);box-shadow:0 12px 30px rgba(0,0,0,.55)}

#guide header b{flex:1}

#guide li{display:flex;gap:8px;color:var(--t2)}#guide li::before{content:"○";color:var(--t4);flex:none}
#guide li.done{color:var(--t4)}#guide li.done::before{content:"●";color:var(--ok)}
#guide code{font-family:var(--mono);color:var(--accent-h);font-size:11.5px}

@media (max-width:1000px){.rpanel,.queue,.hmap,.party{display:none}.hcmd{width:300px}#guide:not(.low){top:auto;bottom:calc(var(--hud-h) + 10px)}}

/* the line is centred in the floor, clear of the frames on the left; the micro chat sits beside the station of the ticket it shows */
function fit() {
  const fl = document.getElementById('floor'), s = document.getElementById('stage'); if (!fl || !s) return;
  const pad = window.innerWidth > 1000 ? 286 : 8, W = 900, H = 556, k = Math.max(0.36, Math.min(1.2, (fl.clientWidth - pad - 16) / W, (fl.clientHeight - 8) / H));
  const x = pad + Math.max(0, (fl.clientWidth - pad - W * k) / 2), y = Math.max(0, (fl.clientHeight - H * k) / 2);
  s.style.transform = `translate(${x}px,${y}px) scale(${k})`;
  const p = document.getElementById('peek'), t = byId(S.sel); if (!p || !t) return;
  const M = MACH[t.hand ? t.hand.from : t.at], left = x + M.x * k, right = left + M.w * k, topY = y + M.y * k, pw = p.offsetWidth, ph = p.offsetHeight;
  const px = right + 14 + pw <= fl.clientWidth - 8 ? right + 14 : left - 14 - pw >= pad ? left - 14 - pw : Math.max(8, fl.clientWidth - pw - 8);
  p.style.left = px + 'px'; p.style.top = Math.max(8, Math.min(topY, fl.clientHeight - ph - 8)) + 'px';
}

  ['putback', 'Quand ton run finit : « Leave Build as ok », ou « Run Build again ».'],
  ['hl', 'Sur le floor, sélectionne un ticket mis de côté et survole les tuiles du HUD : le bras de sortie s\'allume.'],
  ['work', 'Passe sur Work (rail de gauche) : même établi, même bande de ligne.'],
];
function guide() {
  const n = STEPS.filter(([k]) => S.done[k]).length;
  document.getElementById('guide').innerHTML = `<header data-a="guide"><b>À essayer</b><span class="mono" style="color:var(--t3)">${n} / ${STEPS.length}</span><span aria-hidden="true">${S.guideOpen ? '▾' : '▸'}</span></header>
    <ol>${(S.guideOpen ? STEPS : STEPS.filter(([k]) => !S.done[k]).slice(0, 1)).map(([k, t]) => `<li class="${S.done[k] ? 'done' : ''}"><span>${t}</span></li>`).join('') || '<li class="done"><span>Tout est vu. Le reste se juge en jouant avec.</span></li>'}</ol>`;
  place();
}

/* ============================================================ input ============================================================ */
function openBench(id) { S.open = id; S.sel = id; S.peek = false; S.justOpened = true; S.sendpop = false; S.hint = ''; S.mm = null; mark('open'); }
function select(id) { S.sel = id; S.peek = true; S.sending = null; mark('peek'); }
function stepSel(d) { const cs = calls(); if (!cs.length) return; const i = cs.findIndex((t) => t.id === S.sel); select(cs[i < 0 ? (d > 0 ? 0 : cs.length - 1) : (i + d + cs.length) % cs.length].id); mark('arrows'); }
function stepNav(d) { const set = navSet(); if (set.length < 2) return; const i = set.findIndex((t) => t.id === S.open); openBench(set[(i + d + set.length) % set.length].id); S.justOpened = false; mark('nav'); }
const A = {
  view: (d) => { S.view = d.v; S.sendpop = false; S.mm = null; S.sending = null; if (d.v === 'work') { if (S.open || S.sel) S.workSel = S.open || S.sel; S.open = null; mark('work'); } },
  pick: (d) => { const now = Date.now(); if (S.sel === d.t && now - (S.pickAt || 0) < 400) openBench(d.t); else select(d.t); S.pickAt = now; },
  bg: () => { if (!S.sending) { S.sel = null; S.peek = false; } },
  unsel: () => { S.sel = null; S.peek = false; },
  open: (d) => openBench(d.t || S.sel),
  close: () => { S.open = null; S.sendpop = false; },
  nav: (d) => stepNav(+d.d),
  scope: (d) => { S.scope = d.v; mark('nav'); },
  wsel: (d) => { S.workSel = d.t; S.sendpop = false; S.hint = ''; S.mm = null; },
  showfloor: (d) => { S.view = 'factory'; S.open = null; select(d.t); },
  mode: (d) => { S.mode = d.v; },
  tool: (d) => { S.tool = S.tool === d.v ? null : d.v; },
  timeline: () => { S.timeline = !S.timeline; },
  take: (d) => take(byId(d.t)),
  put: (d) => putBack(d.t ? byId(d.t) : cur(), d.how, d.arg),
  sendpop: () => { S.sendpop = !S.sendpop; },
  sendto: (d) => { S.sending = d.t; S.peek = false; },
  sendhere: (d) => { const t = byId(S.sending); if (t && t.hand && d.m2 !== 'exit' && d.m2 !== t.hand.from) putBack(t, 'to', d.m2); else S.sending = null; },
  decide: (d) => decide(byId(d.t), d.o),
  retry: (d) => { const t = byId(d.t); t.phase = 'wait'; t.note = ''; t.thread.push({ k: 'ev', txt: `${MACH[t.at].name} runs again` }); startRuns(); },
  release: (d) => { const t = byId(d.t); arrive(t, nextOf(t.at), 'Released from ' + MACH[t.at].name); startRuns(); },
  send: (d) => { const t = cur(); send(t, t.draft, !!d.only); },
  mention: (d) => { const t = cur(); t.draft = t.draft.replace(/@[\w:-]*$/, '@' + d.k + ' '); S.mm = null; setTimeout(() => { const e = document.getElementById('draft'); if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); } }); },
  guide: () => { S.guideOpen = !S.guideOpen; guide(); },
  toastact: () => { document.getElementById('toast').hidden = true; if (toastAct) toastAct(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-a]');
  if (!el) { if (S.sendpop) { S.sendpop = false; render(); } return; }
  const a = el.dataset.a; if (!A[a] || el.disabled) return;
  if (a === 'bg' && e.target.closest('.party,.peek,.pickbar')) return;
  A[a](el.dataset); if (a !== 'guide') render();
});
/* pointing at a command lights what it would use on the floor: the arm the ticket would leave by, the machine it would go to */
document.addEventListener('mouseover', (e) => { const el = e.target.closest('[data-hl]'); if (!el) return; for (const k of el.dataset.hl.split(',')) document.querySelectorAll(`[data-key="${k}"]`).forEach((n) => n.classList.add('hl')); if (byId(S.sel) && byId(S.sel).hand) mark('hl'); });
document.addEventListener('mouseout', (e) => { if (e.target.closest('[data-hl]')) document.querySelectorAll('.hl').forEach((n) => n.classList.remove('hl')); });
document.addEventListener('input', (e) => {
  const t = e.target.id === 'draft' ? cur() : e.target.id === 'peekdraft' ? byId(S.sel) : null; if (!t) return;
  t.draft = e.target.value; if (e.target.id !== 'draft') return;
  const m = /@([\w:-]*)$/.exec(e.target.value.slice(0, e.target.selectionStart));
  const mm = m ? m[1] : null, before = S.launch; S.launch = /@(agent|skill|panel):[\w-]+/.test(t.draft);
  if (mm !== S.mm || S.launch !== before || S.hint) { S.mm = mm; S.hint = ''; render(); }
});
document.addEventListener('keydown', (e) => {
  const el = e.target, typing = /^(TEXTAREA|INPUT|SELECT)$/.test(el.tagName), arrow = e.key === 'ArrowLeft' ? -1 : e.key === 'ArrowRight' ? 1 : 0;
  if (el.id === 'draft' || el.id === 'peekdraft') {
    const t = el.id === 'draft' ? cur() : byId(S.sel);
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault();
      if (el.id === 'draft' && S.mm != null) { const first = MENTIONS.find((m) => m.k.includes(S.mm)); if (first) { A.mention({ k: first.k }); return render(); } }
      send(t, t.draft); return render(); }
    /* an empty field lets Escape and the arrows through: they close, and walk the tickets. With text in it, Escape only leaves the field */
    if (e.key === 'Escape' && (S.mm != null || el.value)) { if (S.mm != null) S.mm = null; else el.blur(); return render(); }
    if (e.key === 'Escape') el.blur();
    else if (!arrow || el.value) return;
  } else if (el.id === 'cmd') {
    if (e.key !== 'Enter') return;
    const c = el.value.trim(), t = cur(); if (!c) return;
    const out = /test/.test(c) ? ' 42 pass · 0 fail' : /status/.test(c) ? ` On branch ticket/${t.num}\n nothing to commit, working tree clean` : /start/.test(c) ? ' SQLite storage initialized\n Event hub disabled\n server: http://localhost:4111' : ' done';
    S.term = (S.term || '') + `<span class="p">ticket/${t.num} ❯</span> ${esc(c)}\n${out}\n<span style="color:var(--t4)"> the line carries on: a command does not set the ticket aside</span>\n`; render();
    const n = document.getElementById('cmd'); if (n) n.focus(); return;
  } else if (typing) return;
  if (S.view !== 'factory') return;
  if (e.key === 'Escape') { if (S.sending) S.sending = null; else if (S.sendpop) S.sendpop = false; else if (S.open) S.open = null; else if (S.peek) S.peek = false; else if (S.sel) S.sel = null; else return; return render(); }
  if (arrow) { e.preventDefault(); if (S.open) stepNav(arrow); else stepSel(arrow); return render(); }
  if (S.open) return;
  if ((e.key === ' ' || e.key === 'Enter') && S.sel) { e.preventDefault(); openBench(S.sel); return render(); }
  const tile = document.querySelector(`.tile[data-key2="${e.key.length === 1 ? e.key.toUpperCase() : e.key}"]`);
  if (tile && tile.dataset.a && !tile.disabled) { e.preventDefault(); tile.click(); }
});

startRuns(); render(); guide();
</script>
