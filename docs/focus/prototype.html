<title>Fleex Focus</title>
<style>
/* Layout: Fleex nav sidebar (200px) · one full-height triage list; details open in a blurred overlay.
   Tokens mirror packages/web/src/lib/themes.ts (Verdant dark, Light) and lib/tints.ts. */
:root{
  color-scheme:dark;
  --bg-base:#09090b;--bg-surface:#18181b;--bg-overlay:#27272a;--bg-hover:rgba(39,39,42,.5);--bg-overlay-hover:#3f3f46;
  --border:#27272a;--border-subtle:rgba(39,39,42,.5);--border-input:#3f3f46;
  --t1:#fafafa;--t2:#a1a1aa;--t3:#82828b;--t4:#75757f;
  --accent:#22c55e;--accent-hover:#4ade80;--accent-muted:rgba(34,197,94,.15);--on-accent:#052e16;
  --glass:rgba(24,24,27,.82);--scrim:rgba(0,0,0,.55);--shadow:0 30px 80px rgba(0,0,0,.55);
  --red-t:#fca5a5;--red-bg:rgba(248,113,113,.15);--red-b:rgba(248,113,113,.25);--red-s:#f87171;
  --orange-t:#fdba74;--orange-bg:rgba(251,146,60,.15);--orange-b:rgba(251,146,60,.25);--orange-s:#fb923c;
  --yellow-t:#fde047;--yellow-bg:rgba(250,204,21,.15);--yellow-b:rgba(250,204,21,.25);--yellow-s:#facc15;
  --green-t:#86efac;--green-bg:rgba(74,222,128,.15);--green-b:rgba(74,222,128,.25);--green-s:#4ade80;
  --blue-t:#93c5fd;--blue-bg:rgba(96,165,250,.15);--blue-b:rgba(96,165,250,.25);--blue-s:#60a5fa;
  --purple-t:#d8b4fe;--purple-bg:rgba(192,132,252,.15);--purple-b:rgba(192,132,252,.25);--purple-s:#c084fc;
  --pink-t:#f9a8d4;--pink-bg:rgba(244,114,182,.15);--pink-b:rgba(244,114,182,.25);--pink-s:#f472b6;
  --indigo-t:#a5b4fc;--indigo-bg:rgba(129,140,248,.15);--indigo-b:rgba(129,140,248,.25);--indigo-s:#818cf8;
  --gray-t:#d4d4d8;--gray-bg:rgba(161,161,170,.15);--gray-b:rgba(161,161,170,.25);--gray-s:#a1a1aa;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;
  --bg-base:#f4f4f5;--bg-surface:#ffffff;--bg-overlay:#e4e4e7;--bg-hover:rgba(228,228,231,.6);--bg-overlay-hover:#d4d4d8;
  --border:#d4d4d8;--border-subtle:rgba(212,212,216,.5);--border-input:#a1a1aa;
  --t1:#18181b;--t2:#52525b;--t3:#646469;--t4:#828289;
  --accent:#4f46e5;--accent-hover:#6366f1;--accent-muted:rgba(99,102,241,.12);--on-accent:#ffffff;
  --glass:rgba(255,255,255,.86);--scrim:rgba(24,24,27,.35);--shadow:0 30px 80px rgba(24,24,27,.25);
  --red-t:#b91c1c;--red-bg:rgba(239,68,68,.10);--red-b:rgba(239,68,68,.30);--red-s:#dc2626;
  --orange-t:#9a3412;--orange-bg:rgba(249,115,22,.10);--orange-b:rgba(249,115,22,.30);--orange-s:#c2410c;
  --yellow-t:#854d0e;--yellow-bg:rgba(234,179,8,.10);--yellow-b:rgba(234,179,8,.30);--yellow-s:#a16207;
  --green-t:#166534;--green-bg:rgba(34,197,94,.10);--green-b:rgba(34,197,94,.30);--green-s:#15803d;
  --blue-t:#1d4ed8;--blue-bg:rgba(59,130,246,.10);--blue-b:rgba(59,130,246,.30);--blue-s:#2563eb;
  --purple-t:#7e22ce;--purple-bg:rgba(168,85,247,.10);--purple-b:rgba(168,85,247,.30);--purple-s:#9333ea;
  --pink-t:#be185d;--pink-bg:rgba(236,72,153,.10);--pink-b:rgba(236,72,153,.30);--pink-s:#db2777;
  --indigo-t:#4338ca;--indigo-bg:rgba(99,102,241,.10);--indigo-b:rgba(99,102,241,.30);--indigo-s:#4f46e5;
  --gray-t:#52525b;--gray-bg:rgba(113,113,122,.10);--gray-b:rgba(113,113,122,.30);--gray-s:#71717a;
}}
:root[data-theme="light"]{
  color-scheme:light;
  --bg-base:#f4f4f5;--bg-surface:#ffffff;--bg-overlay:#e4e4e7;--bg-hover:rgba(228,228,231,.6);--bg-overlay-hover:#d4d4d8;
  --border:#d4d4d8;--border-subtle:rgba(212,212,216,.5);--border-input:#a1a1aa;
  --t1:#18181b;--t2:#52525b;--t3:#646469;--t4:#828289;
  --accent:#4f46e5;--accent-hover:#6366f1;--accent-muted:rgba(99,102,241,.12);--on-accent:#ffffff;
  --glass:rgba(255,255,255,.86);--scrim:rgba(24,24,27,.35);--shadow:0 30px 80px rgba(24,24,27,.25);
  --red-t:#b91c1c;--red-bg:rgba(239,68,68,.10);--red-b:rgba(239,68,68,.30);--red-s:#dc2626;
  --orange-t:#9a3412;--orange-bg:rgba(249,115,22,.10);--orange-b:rgba(249,115,22,.30);--orange-s:#c2410c;
  --yellow-t:#854d0e;--yellow-bg:rgba(234,179,8,.10);--yellow-b:rgba(234,179,8,.30);--yellow-s:#a16207;
  --green-t:#166534;--green-bg:rgba(34,197,94,.10);--green-b:rgba(34,197,94,.30);--green-s:#15803d;
  --blue-t:#1d4ed8;--blue-bg:rgba(59,130,246,.10);--blue-b:rgba(59,130,246,.30);--blue-s:#2563eb;
  --purple-t:#7e22ce;--purple-bg:rgba(168,85,247,.10);--purple-b:rgba(168,85,247,.30);--purple-s:#9333ea;
  --pink-t:#be185d;--pink-bg:rgba(236,72,153,.10);--pink-b:rgba(236,72,153,.30);--pink-s:#db2777;
  --indigo-t:#4338ca;--indigo-bg:rgba(99,102,241,.10);--indigo-b:rgba(99,102,241,.30);--indigo-s:#4f46e5;
  --gray-t:#52525b;--gray-bg:rgba(113,113,122,.10);--gray-b:rgba(113,113,122,.30);--gray-s:#71717a;
}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-base);color:var(--t1);font:13px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block;flex:none}
.mono{font-family:var(--mono)}
kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--border-input);border-radius:4px;padding:0 4px;color:var(--t2);background:var(--bg-surface)}

.app{display:grid;grid-template-columns:200px minmax(0,1fr);height:100%}

/* ---------- nav (NavSidebar) ---------- */
.nav{display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg-base);min-height:0;overflow:auto}
.logo{display:flex;align-items:center;gap:8px;padding:16px;border-bottom:1px solid var(--border)}
.logo svg{color:var(--accent)}
.logo b{font-size:16px;letter-spacing:-.01em}.logo b span{color:var(--accent)}
.nav .grp{display:flex;flex-direction:column;gap:4px;padding-top:8px}
.nav .sep{margin:4px 0;border-top:1px solid var(--border-subtle)}
.ni{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:8px 16px;border:0;border-left:2px solid transparent;background:none;color:var(--t3);text-align:left;font-size:13px}
.ni:hover{background:var(--bg-hover);color:var(--t2)}
.ni[aria-current="page"]{border-left-color:var(--accent);background:var(--bg-hover);color:var(--t1)}
.ni .bd{margin-left:auto;min-width:18px;height:18px;padding:0 5px;border-radius:9px;display:grid;place-items:center;font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--bg-overlay);color:var(--t2)}
.ni .bd.hot{background:var(--yellow-s);color:#1c1403}
.ni .new{margin-left:auto;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:0 4px}
.ni .new+.bd{margin-left:4px}
.nav .bottom{margin-top:auto;border-top:1px solid var(--border-subtle);padding:4px 0}

/* ---------- main ---------- */
.main{display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;min-width:0;min-height:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:18px 28px 12px}
.title{display:flex;align-items:center;gap:10px;min-width:0}
.title h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.title .count{font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;padding:2px 9px;border-radius:9999px;border:1px solid var(--yellow-b);background:var(--yellow-bg);color:var(--yellow-t)}
.title .count.zero{border-color:var(--green-b);background:var(--green-bg);color:var(--green-t)}
.head .sub{flex-basis:100%;margin-top:-6px;color:var(--t3);font-size:12.5px}
.head .tools{margin-left:auto;display:flex;flex-wrap:wrap;gap:6px}
.tbtn{height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface);color:var(--t2);font-size:12px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tbtn:hover{border-color:var(--border-input);color:var(--t1)}
.tbtn[aria-pressed="true"]{border-color:var(--accent);color:var(--t1);background:var(--accent-muted)}

.pulse{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin:0 28px;padding:8px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);font-size:12px;color:var(--t3)}
.pulse b{color:var(--t1);font-variant-numeric:tabular-nums;font-weight:600}
.pulse .warn b{color:var(--orange-t)}
.pulse .spark{display:flex;align-items:center;gap:8px;margin-left:auto}
.pulse svg text{fill:var(--t4);font-size:8px;font-family:var(--mono)}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:12px 28px 8px}
.chip{height:26px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border-radius:9999px;border:1px solid var(--border);background:none;color:var(--t2);font-size:12px;font-weight:500}
.chip:hover{border-color:var(--border-input);color:var(--t1)}
.chip[aria-pressed="true"]{background:var(--bg-overlay);border-color:var(--border-input);color:var(--t1)}
.chip .n{font-variant-numeric:tabular-nums;color:var(--t3)}
.chip .dot{width:7px;height:7px;border-radius:50%}
.bar .sp{flex:1}
.sel{height:26px;border-radius:6px;border:1px solid var(--border);background:var(--bg-surface);color:var(--t2);font-size:12px;padding:0 6px}
.snz{font-size:12px;color:var(--t3);display:inline-flex;gap:6px;align-items:center}
.snz button{border:0;background:none;color:var(--accent);font-size:12px;padding:0;text-decoration:underline dotted}

/* ---------- list ---------- */
.listwrap{overflow:auto;min-height:0;padding:4px 28px 24px}
.list{display:grid;gap:6px}
.row{position:relative;display:grid;grid-template-columns:92px minmax(0,1fr) auto 64px 108px;gap:14px;align-items:center;padding:10px 14px 10px 16px;border:1px solid var(--border);border-radius:8px;background:var(--bg-surface);cursor:pointer;transition:border-color .12s,background .12s,opacity .25s,transform .25s}
.row::before{content:"";position:absolute;left:-1px;top:-1px;bottom:-1px;width:3px;border-radius:8px 0 0 8px;background:var(--k-s)}
.row:hover{border-color:var(--border-input)}
.row.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row.fresh{animation:fresh 1.6s ease-out}
@keyframes fresh{0%{background:var(--k-bg)}100%{background:var(--bg-surface)}}
.row.out{opacity:0;transform:translateX(24px)}
.kind{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:9999px;border:1px solid var(--k-b);background:var(--k-bg);color:var(--k-t);font-size:11px;font-weight:600;white-space:nowrap;justify-self:start}
.body{min-width:0;display:grid;gap:3px}
.l1{display:flex;align-items:center;gap:7px;min-width:0}
.l1 .id{font-family:var(--mono);font-size:11.5px;color:var(--t3);white-space:nowrap}
.l1 .tt{font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.board{flex:none;border-radius:4px;background:var(--bg-overlay);color:var(--t3);padding:1px 6px;font-size:10.5px}
.st{flex:none;border-radius:9999px;padding:0 7px;font-size:10.5px;font-weight:500;border:1px solid}
.l2{font-size:12.5px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2 q{color:var(--t1);quotes:"« " " »"}
.l2 .bad{color:var(--red-t)}
.l2 .who{color:var(--purple-t)}
.acts{display:flex;align-items:center;gap:6px;justify-content:flex-end;flex-wrap:nowrap}
.b{height:28px;padding:0 11px;border-radius:6px;border:1px solid var(--border-input);background:var(--bg-surface);color:var(--t1);font-size:12px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.b:hover{background:var(--bg-overlay)}
.b.p{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:600}
.b.p:hover{background:var(--accent-hover)}
.b .k{font-family:var(--mono);font-size:9.5px;opacity:.7}
.reply{display:flex;align-items:center;gap:4px;width:300px;max-width:100%}
.reply input{flex:1;min-width:0;height:28px;border-radius:6px;border:1px solid var(--border-input);background:var(--bg-base);padding:0 9px;font-size:12px}
.reply input:focus{outline:none;border-color:var(--accent)}
.sugg{display:flex;gap:4px}
.sugg button{height:24px;padding:0 8px;border-radius:9999px;border:1px dashed var(--border-input);background:none;color:var(--t2);font-size:11.5px;white-space:nowrap}
.sugg button:hover{border-style:solid;color:var(--t1)}
.age{font-family:var(--mono);font-size:11.5px;color:var(--t3);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.age.old{color:var(--orange-t)}
.age small{display:block;font-family:var(--sans);font-size:10px;color:var(--t4)}

/* SmartSessionButton */
.ssb{width:108px;height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;border-radius:6px;border:1px solid;font-size:12px;font-weight:500;white-space:nowrap}
.ssb .d{width:7px;height:7px;border-radius:50%;background:currentColor}
.ssb .cv{margin-left:auto;opacity:.8}
.ssb.open{border-color:color-mix(in srgb,var(--accent) 40%,transparent);background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--accent)}
.ssb.open:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.ssb.appr{border-color:var(--yellow-b);background:var(--yellow-bg);color:var(--yellow-t)}
.ssb.idle{border-color:color-mix(in srgb,var(--t3) 30%,transparent);background:color-mix(in srgb,var(--t3) 8%,transparent);color:var(--t3)}
.ssb.work{border-color:var(--blue-b);background:var(--blue-bg);color:var(--blue-t)}
.ssb.idle:hover,.ssb.appr:hover{filter:brightness(1.15)}

.launcher{position:fixed;z-index:60;width:380px;max-width:calc(100vw - 32px);max-height:360px;overflow:auto;border-radius:8px;border:1px solid var(--border);background:var(--bg-surface);box-shadow:0 20px 50px rgba(0,0,0,.45);padding-bottom:4px}
.launcher .s{position:sticky;top:0;z-index:2;height:46px;padding:8px;border-bottom:1px solid var(--border);background:var(--bg-surface)}
.launcher .s input{width:100%;height:30px;border-radius:6px;border:1px solid var(--border);background:var(--bg-overlay);padding:0 8px;font-size:12px}
.launcher .gh{position:sticky;top:46px;z-index:1;background:var(--bg-surface);padding:8px 12px 4px;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t4)}
.launcher .chips{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px 2px}
.launcher .chips button{height:22px;padding:0 8px;border-radius:9999px;border:1px solid var(--border);background:none;color:var(--t2);font-size:11px}
.launcher .chips button[aria-pressed="true"]{background:var(--bg-overlay);color:var(--t1);border-color:var(--border-input)}
.lr{display:flex;align-items:center;gap:8px;width:100%;padding:6px 12px;border:0;background:none;text-align:left;font-size:12px;color:var(--t1)}
.lr:hover,.lr.on{background:var(--bg-hover)}
.lr .tok{margin-left:auto;font-family:var(--mono);font-size:9px;color:var(--t4)}
.lr .sd{width:7px;height:7px;border-radius:50%}

/* primitives badges */
.pm{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:4px;font-size:8.5px;font-weight:700;font-family:var(--mono);flex:none}

/* ---------- empty ---------- */
.empty{display:grid;justify-items:center;gap:10px;padding:56px 16px 24px;text-align:center}
.empty .ring{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--green-b);background:var(--green-bg);color:var(--green-s)}
.empty h2{margin:4px 0 0;font-size:18px;font-weight:700}
.empty p{margin:0;color:var(--t3);max-width:52ch}
.running{margin-top:18px;width:min(560px,100%);display:grid;gap:4px;text-align:left}
.running .h{font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t4);padding:0 4px 2px}
.rr{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;border:1px solid var(--border-subtle);color:var(--t3);font-size:12px;min-width:0}
.rr .tt{color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rr .ping{width:7px;height:7px;border-radius:50%;background:var(--blue-s);box-shadow:0 0 0 0 var(--blue-s);animation:ping 1.6s infinite;flex:none}
@keyframes ping{70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.rr .eta{margin-left:auto;font-family:var(--mono);font-size:11px;white-space:nowrap}

.foot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:8px 28px;border-top:1px solid var(--border);font-size:11px;color:var(--t4)}
.foot span{display:inline-flex;gap:4px;align-items:center}

/* ---------- overlay ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:grid;place-items:start center;padding:6vh 16px 16px;overflow:auto;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(860px,100%);border-radius:14px;border:1px solid var(--border-input);background:var(--bg-surface);box-shadow:var(--shadow);animation:rise .18s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}}
.mh{display:grid;gap:8px;padding:16px 20px 14px;border-bottom:1px solid var(--border)}
.mh .r1{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.mh .r1 .sp{flex:1}
.mh h2{margin:0;font-size:18px;line-height:1.25;font-weight:700;text-wrap:balance}
.x{width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--t3);display:grid;place-items:center}
.x:hover{color:var(--t1);border-color:var(--border-input)}
.ask{margin:16px 20px 0;padding:14px 16px;border-radius:10px;border:1px solid var(--k-b);background:var(--k-bg)}
.ask .ah{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--k-t);margin-bottom:6px}
.ask p{margin:0 0 10px;color:var(--t1);max-width:70ch}
.ask blockquote{margin:0 0 10px;padding:8px 12px;border-left:3px solid var(--k-s);background:var(--bg-surface);border-radius:0 6px 6px 0;font-size:14px;color:var(--t1)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.opt{display:grid;gap:2px;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid var(--border-input);background:var(--bg-surface);color:var(--t1)}
.opt:hover{border-color:var(--t3)}
.opt b{font-size:13px;display:flex;gap:8px;align-items:center}
.opt small{color:var(--t3);font-size:11.5px}
.opt.p{background:var(--accent);border-color:transparent;color:var(--on-accent)}
.opt.p small{color:var(--on-accent);opacity:.8}
.opt.p:hover{background:var(--accent-hover)}
.opt kbd{margin-left:auto;background:transparent;color:inherit;border-color:currentColor;opacity:.6}
.ta{width:100%;min-height:64px;resize:vertical;border-radius:8px;border:1px solid var(--border-input);background:var(--bg-base);padding:9px 11px;font-size:13px;margin-bottom:8px}
.ta:focus{outline:none;border-color:var(--accent)}

/* ---------- resolve ---------- */
let toastT=null;
function toast(msg,undo){ clearTimeout(toastT); const L=$('layer'); L.querySelector('.toast')?.remove();
  L.insertAdjacentHTML('beforeend',`<div class="toast" role="status"><span>${msg}</span>${undo?'<button type="button" data-undo="1">Annuler</button>':''}</div>`);
  toastT=setTimeout(()=>{ L.querySelector('.toast')?.remove(); S.undo=null; },5000); }
function resolve(id,msg){ const x=byId(id); if(!x) return; const row=document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
  const idxInVisible=visible().findIndex(v=>v.id===id), wasModal=S.modal===id;
  const finish=()=>{ S.items=S.items.filter(v=>v.id!==id); S.done.push(Math.max(1,Math.round(ageMin(x.since)))); S.undo={x,done:true};
    if(wasModal){ S.modal=null; const next=visible()[Math.min(idxInVisible,visible().length-1)]; if(S.chain&&next){ S.modal=next.id; } }
    S.cur=Math.min(idxInVisible,Math.max(0,visible().length-1)); closeLauncher(); drawAll(); if(!S.modal) closeModalDom(); toast(msg,true);
    if(!S.items.length) toast('Liste vide. Bien joué.',false); };
  if(row&&!wasModal){ row.classList.add('out'); setTimeout(finish,220); } else finish(); }
function undo(){ if(!S.undo) return; const {x,done,snooze}=S.undo; if(done) S.done.pop(); if(snooze) S.snoozed=S.snoozed.filter(s=>s.id!==x.id);
  S.items.push(x); x.fresh=true; S.undo=null; $('layer').querySelector('.toast')?.remove(); drawAll(); }
function snooze(id){ const x=byId(id); if(!x) return; S.items=S.items.filter(v=>v.id!==id); S.snoozed.push(x); S.undo={x,snooze:true}; if(S.modal===id){ S.modal=null; closeModalDom(); } drawAll(); toast(`#${x.id} en pause, revient dans 1 h`,true); }
function act(id,a,i){ const x=byId(id); if(!x) return; const ref=x.routine?x.title:'#'+x.id;
  if(a==='opt'){ const o=x.opts[i]; const note=document.querySelector('#gnote')?.value.trim(); resolve(id,`Gate « ${esc(x.step)} » : ${esc(o.l)} · ${ref} → ${esc(o.to)}${note?' · commentaire joint':''}`); }
  else if(a==='send'||a==='sugg'){ const inp=S.modal===id?$('mreply'):document.querySelector(`[data-in="${CSS.escape(id)}"]`), v=a==='sugg'?x.sugg[i]:(inp?.value||'').trim();
    if(!v){ inp&&inp.focus(); return; }
    resolve(id,`Réponse envoyée à @${esc(x.by)} · ${ref} reprend`); }
  else if(a==='retry') resolve(id,x.routine?`Routine relancée · run #59 démarré`:`${ref} relancé · même agent, même étape`);
  else if(a==='retry-alt') resolve(id,`${ref} relancé avec un autre modèle`);
  else if(a==='pause') resolve(id,`Routine « ${esc(x.title)} » mise en pause`);
  else if(a==='relaunch') resolve(id,`@${esc(x.by)} relancé sur ${ref}`);
  else if(a==='done') resolve(id,`${ref} passé en Done`);
  else if(a==='cancel') resolve(id,`${ref} passé en Cancelled`); }
function primary(x,n){ // keyboard 1..3 on the selected row
  if(x.kind==='gate'){ if(x.opts[n]) act(x.id,'opt',n); }
  else if(x.kind==='question'){ if(x.sugg&&x.sugg[n]) act(x.id,'sugg',n); }
  else if(x.kind==='error'){ if(n===0) act(x.id,'retry'); if(n===1&&x.routine) act(x.id,'pause'); }
  else { if(n===0) act(x.id,'relaunch'); if(n===1) act(x.id,'done'); } }

    <div class="mgrid">
      <div><div class="sec"><h4>${pm(x.routine?'routine':'persona')} Dernier message${x.routine?' de la routine':' de @'+esc(x.by)}</h4><div class="msg"><div class="mh2"><b>${x.routine?esc(x.title):'@'+esc(x.by)}</b><span>· il y a ${age(x.since)}</span></div>${esc(x.last)}</div></div>
        <div class="sec"><h4>Livrables · ${x.dl.length}</h4>${x.dl.length?x.dl.map(d=>`<button type="button" class="dl"><span class="sw" style="background:${DT[d.ty][1]}"></span><span>${esc(d.t)}</span>${d.u?'<span class="ud" title="Non lu"></span>':''}<small>${DT[d.ty][0]} · ${esc(d.by)} · ${d.st}</small></button>`).join(''):'<span style="color:var(--t4);font-size:12px">aucun livrable</span>'}</div></div>
      <div>${pipe}<div class="sec"><h4>Contexte</h4><dl class="kv"><dt>Repo</dt><dd>${esc(x.repo)}</dd><dt>Branche</dt><dd><code>${esc(x.br)}</code></dd><dt>PR</dt><dd>${x.pr?`<span class="prp" style="color:var(--${prh}-t);border-color:var(--${prh}-b);background:var(--${prh}-bg)">#${x.pr.n} · ${x.pr.s}</span>`:'aucune'}</dd><dt>Coût</dt><dd class="mono">$${x.cost}</dd><dt>Commentaires</dt><dd>${x.com}</dd><dt>Session</dt><dd>${ssbHtml(x)}</dd></dl></div></div>
    </div>
    <div class="mf"><span class="snzmenu"><button type="button" class="b" data-snzmenu="1">Plus tard ▾</button></span><label class="tg"><input type="checkbox" id="chain" ${S.chain?'checked':''}> Après une action, ouvrir le suivant</label><span class="sp"></span><span><kbd>1</kbd>–<kbd>3</kbd> options · <kbd>J</kbd><kbd>K</kbd> suivant/précédent · <kbd>Échap</kbd> fermer</span></div>
  </div></div>`;
  const L=$('layer'); L.querySelector('.scrim')?.remove(); L.insertAdjacentHTML('afterbegin',html);
  if(S.modalSec==='log') document.getElementById('sec-log')?.scrollIntoView({block:'center'}); S.modalSec=null;
  if(x.kind==='question') setTimeout(()=>$('mreply')?.focus(),60); else setTimeout(()=>L.querySelector('.opt.p')?.focus(),60); }
function openModal(id,sec){ S.modal=id; S.modalSec=sec||null; const l=visible(); S.cur=Math.max(0,l.findIndex(v=>v.id===id)); closeLauncher(); drawList(); drawModal(); }
function closeModalDom(){ $('layer').querySelector('.scrim')?.remove(); }
function closeModal(){ S.modal=null; closeModalDom(); drawList(); }

/* ---------- launcher (SmartSessionButton menu) ---------- */
const LAUNCH=[
 ['skill','Review de code','@skill:review'],['skill','Préparer le ticket','@skill:prepare'],['skill','Réparer la CI','@skill:fix-ci'],['skill','PR-FAQ','@skill:pr-faq'],
 ['workflow','Feature delivery','@workflow:feature'],['workflow','Bugfix','@workflow:bugfix'],
 ['persona','Dev','@agent:dev'],['persona','Archi','@agent:archi'],['persona','Reviewer','@agent:reviewer'],['persona','PM','@agent:pm'],
 ['panel','Comité produit','@panel:produit'],['panel','Squad archi','@panel:archi'],
];
const FREQ=[0,6,4];
function drawLauncher(){ const L=$('layer'); L.querySelector('.launcher')?.remove(); if(!S.launcher) return; const {id,rect,filter,q}=S.launcher, x=byId(id); if(!x) return;
  const f=filter||'all', qq=(q||'').toLowerCase();
  const match=it=>(f==='all'||it[0]===f)&&(!qq||(it[1]+' '+it[2]).toLowerCase().includes(qq));
  const groups=[['skill','Skills'],['workflow','Workflows'],['panel','Panels'],['persona','Personas']];
  const sess=x.ssb==='open'?[]:[[x.ssb==='appr'?'yellow':'gray',`claude · ${x.br}`,x.ssb==='appr'?'Question':'Idle']];
  const row=(it)=>{ const ix=LAUNCH.indexOf(it); return `<button type="button" class="lr" role="menuitem" data-launch="${ix}">${pm(it[0])}<span>${esc(it[1])}</span><span class="tok">${esc(it[2])}</span></button>`; };
  const cnt=k=>LAUNCH.filter(it=>k==='all'||it[0]===k).length;
  const html=`<div class="launcher" role="menu" aria-label="Lancer sur #${x.id}">
    <div class="s"><input id="lq" value="${esc(q||'')}" placeholder="Filtrer — ou naviguer ↑ ↓" aria-label="Filtrer"></div>
    ${sess.length&&!qq?`<div class="gh">Sessions</div>${sess.map(([h,n,s])=>`<button type="button" class="lr" data-sess="1"><span class="sd" style="background:var(--${h}-s)"></span><span>${esc(n)}</span><span class="tok" style="color:var(--${h}-t);font-family:var(--sans);font-size:11px">${s}</span></button>`).join('')}`:''}
    ${x.ssb==='open'&&!qq?`<div class="gh">Sessions</div><button type="button" class="lr" data-newsess="1"><span class="sd" style="background:var(--accent)"></span><span>Nouvelle session Claude sur ${esc(x.br)}</span></button>`:''}
    <div class="chips">${[['all','Tous'],['skill','Skills'],['workflow','Workflows'],['persona','Personas'],['panel','Panels']].map(([k,l])=>`<button type="button" data-lf="${k}" aria-pressed="${f===k}">${l} <span style="opacity:.7">${cnt(k)}</span></button>`).join('')}</div>
    ${f==='all'&&!qq?`<div class="gh">Fréquents</div>${FREQ.map(i=>row(LAUNCH[i])).join('')}`:''}
    ${groups.map(([k,l])=>{ const its=LAUNCH.filter(it=>it[0]===k&&match(it)); return its.length?`<div class="gh">${l}</div>${its.map(row).join('')}`:''; }).join('')}
  </div>`;
  L.insertAdjacentHTML('beforeend',html); const el=L.querySelector('.launcher'); const h=el.offsetHeight, w=el.offsetWidth;
  let top=rect.bottom+6, left=Math.min(rect.right-w,innerWidth-w-16); left=Math.max(16,left); if(top+h>innerHeight-8) top=Math.max(8,rect.top-h-6);
  el.style.top=top+'px'; el.style.left=left+'px'; const i=$('lq'); i.focus(); i.setSelectionRange(i.value.length,i.value.length); }
function openLauncher(id,btn){ S.launcher={id,rect:btn.getBoundingClientRect(),filter:'all',q:''}; drawLauncher(); }
function closeLauncher(){ S.launcher=null; $('layer').querySelector('.launcher')?.remove(); }

/* ---------- ideas panel ---------- */
const IDEAS={
 'Déjà dans cette ébauche':[
  ['Actions directes dans la ligne','Gate, réponse, relance ou Done sans ouvrir le ticket. Le SmartSessionButton reste à droite pour tout le reste.','in'],
  ['Réponses proposées par l’agent','Quand l’agent pose une question fermée, ses options deviennent des pastilles cliquables (touches 1–3).','in'],
  ['Enchaîner','Après une action dans la popup, le ticket suivant s’ouvre : on vide la liste sans revenir au listing.','in'],
  ['Plus tard, mais visible','Mettre en pause retire l’item pendant 1 h ; le compteur « en pause » reste affiché pour que la liste ne mente pas.','in'],
  ['Annuler','Chaque action a 5 s d’annulation. La vitesse est encouragée sans rendre les erreurs coûteuses.','in'],
  ['Mode zen','Masque les indicateurs. La liste et son compteur suffisent.','in'],
 ],
 'Enrichir':[
  ['Coût de l’attente plutôt que l’âge','Trier par « temps agent perdu » : un ticket bloqué sur une gate en amont d’un workflow de 6 étapes coûte plus qu’un idle en Reviewing. Signal simple : âge × étapes restantes × priorité.','m'],
  ['Actions groupées','Sélection multiple (⇧J/⇧K) pour « Passer en Done » les idle dont la PR est mergée, ou relancer toutes les erreurs de rate limit d’un coup.','m'],
  ['Regroupement par cause','Trois erreurs « GitHub 403 » dans l’heure deviennent une seule ligne avec un seul « Relancer tout ». Évite la modération répétitive.','h'],
  ['Diff résumé sur les gates de merge','Sur une gate de merge : fichiers touchés, +/−, checks CI, dans la popup. Assez pour décider sans ouvrir GitHub.','m'],
  ['Notification quand la liste se remplit','Badge sur l’onglet Focus, et une notification Pulse seulement au-delà d’un seuil (ex. une gate qui attend plus de 30 min).','l'],
  ['Délégation','« Confier à… » un humain d’un board partagé : l’item quitte ma liste et arrive dans la sienne.','h'],
 ],
 'Épurer':[
  ['Pas de timeline','La timeline de Ton bureau décrit le passé. Focus ne sert qu’à ce qui attend une action : on l’a laissée de côté. Le lien « Ouvrir le ticket » suffit pour l’historique.','l'],
  ['Stats en une ligne, repliables','Pas de dashboard. Une ligne (traités, réaction médiane, plus ancien) et une mini-série de 7 jours. Le mode zen les masque ; on peut le mettre par défaut.','l'],
  ['Pas de pile des livrés','La pile de Ton bureau récompense le volume. Ici, la seule récompense est l’état vide.','l'],
  ['Idle optionnel','L’idle n’est pas une demande de l’agent. Il pourrait être masqué par défaut, ou n’apparaître qu’après un seuil (ex. 2 h), pour que la liste ne contienne que des demandes explicites.','l'],
 ],
 'Mesurer le focus sans distraire':[
  ['Réaction médiane','Temps entre l’arrivée d’un item et son traitement. C’est l’indicateur qui dit si le focus marche. Le throughput mesure plutôt l’activité des agents.','in'],
  ['Plus ancien en attente','Le seul chiffre qui passe en orange : il dit tout de suite si quelque chose pourrit.','in'],
  ['Listes vidées','Nombre de fois où la liste a atteint zéro dans la semaine. Donne un objectif qui correspond au job, sans pousser au volume.','in'],
 ],
 'Questions ouvertes':[
  ['Focus et Cockpit','Cockpit liste tout le Doing/Reviewing par groupe ; Focus n’en garde que ce qui attend un humain. Fusionner (Cockpit avec un filtre « à moi ») ou garder deux entrées ?','q'],
  ['« À moi » ou « à un humain »','Sur un board partagé, faut-il filtrer par assignee, par auteur du ticket, ou par la personne mentionnée dans la gate ?','q'],
  ['Routines','Les routines en échec n’ont pas de ticket. Les garder dans Focus (comme ici) ou les laisser au badge Routines de la navbar ?','q'],
 ],
};
const TAG={l:['Léger','green'],m:['Moyen','yellow'],h:['Lourd','orange'],q:['À trancher','blue']};
function drawIdeas(){ const L=$('layer'); L.querySelector('.ideas')?.remove(); if(!S.ideas) return;
  L.insertAdjacentHTML('beforeend',`<aside class="ideas" role="dialog" aria-label="Pistes d’évolution"><div style="display:flex;align-items:center;gap:8px"><h2>Pistes d’évolution</h2><span style="flex:1"></span><button class="x" type="button" data-ideas-close="1" aria-label="Fermer">✕</button></div>
    <p class="lede">Ce qui est déjà maquetté, puis ce qu’on pourrait ajouter ou retirer. L’étiquette donne l’effort estimé.</p>
    ${Object.entries(IDEAS).map(([h,list])=>`<h3>${h}</h3>${list.map(([t,p,g])=>`<div class="idea">${g==='in'?'<span class="in">✓ maquetté</span>':`<span class="tag" style="color:var(--${TAG[g][1]}-t);border-color:var(--${TAG[g][1]}-b);background:var(--${TAG[g][1]}-bg)">${TAG[g][0]}</span>`}<b>${t}</b><p>${p}</p></div>`).join('')}`).join('')}</aside>`); }

/* ---------- events ---------- */
document.addEventListener('click',e=>{ const q=s=>e.target.closest(s); let el;
  if(q('[data-undo]')) return undo();
  if((el=q('[data-launch]'))){ const it=LAUNCH[+el.dataset.launch], id=S.launcher.id, x=byId(id); const verb=it[0]==='skill'?'Skill':it[0]==='workflow'?'Workflow':it[0]==='panel'?'Panel':'Agent'; resolve(id,`${verb} ${esc(it[1])} lancé sur ${x.routine?x.title:'#'+x.id} · ${esc(it[2])}`); return; }
  if(q('[data-sess]')){ const x=byId(S.launcher.id); closeLauncher(); toast(`Session ouverte en overlay · ${esc(x.br)}`); return; }
  if(q('[data-newsess]')){ const id=S.launcher.id; resolve(id,`Nouvelle session Claude ouverte sur #${id}`); return; }
  if((el=q('[data-lf]'))){ S.launcher.filter=el.dataset.lf; return drawLauncher(); }
  if(S.launcher&&!q('.launcher')&&!q('[data-ssb]')) closeLauncher();
  if((el=q('[data-ssb]'))){ e.stopPropagation(); const id=el.dataset.ssb; if(S.launcher&&S.launcher.id===id) return closeLauncher(); return openLauncher(id,el); }
  if(q('[data-ideas-close]')){ S.ideas=false; return drawIdeas(); }
  if(q('#ideasBtn')){ S.ideas=!S.ideas; return drawIdeas(); }
  if(q('#zen')){ S.zen=!S.zen; try{localStorage.setItem('focus-zen',S.zen?'1':'0')}catch(_){} return drawHead(); }
  if(q('#arrive')){ const nx=S.pool.shift(); if(!nx){ toast('Plus d’arrivée simulée en réserve'); return; } const it={...nx,since:NOW(),fresh:true}; S.items.push(it); drawAll(); toast(`Nouvelle ${KIND[it.kind].l.toLowerCase()} · #${it.id}`); return; }
  if((el=q('[data-f]'))){ S.filter=el.dataset.f; S.cur=0; return drawAll(); }
  if(q('[data-unsnooze]')){ S.snoozed.forEach(x=>{x.fresh=true;S.items.push(x)}); S.snoozed=[]; return drawAll(); }
  if(q('[data-snzmenu]')){ const w=q('.snzmenu'); const m=w.querySelector('.m'); if(m){ m.remove(); return; } w.insertAdjacentHTML('beforeend',`<div class="m"><button type="button" data-snz="1">Dans 1 h</button><button type="button" data-snz="1">Demain matin</button><button type="button" data-snz="1">Quand la PR est mergée</button></div>`); return; }
  if(q('[data-snz]')) return snooze(S.modal);
  if(q('[data-close]')||e.target.id==='scrim') return closeModal();
  if((el=q('[data-nav]'))){ const l=visible(), i=l.findIndex(v=>v.id===S.modal), n=l[(i+ +el.dataset.nav+l.length)%l.length]; return openModal(n.id); }
  if((el=q('[data-open]'))){ e.stopPropagation(); return openModal(el.dataset.open,el.dataset.sec); }
  const host=q('.row')||q('.modal'); const id=q('.row')?q('.row').dataset.id:S.modal;
  if((el=q('[data-act]'))&&id){ return act(id,el.dataset.act,+el.dataset.i||0); }
  if((el=q('[data-sugg]'))&&id){ return act(id,'sugg',+el.dataset.sugg); }
  if(q('.row')&&!q('input,button,select,textarea')) return openModal(q('.row').dataset.id);
});
document.addEventListener('input',e=>{ if(e.target.id==='lq'){ S.launcher.q=e.target.value; drawLauncher(); } });
document.addEventListener('change',e=>{ if(e.target.id==='boardSel'){ S.board=e.target.value; S.cur=0; drawAll(); } if(e.target.id==='sortSel'){ S.sort=e.target.value; drawAll(); } if(e.target.id==='chain'){ S.chain=e.target.checked; try{localStorage.setItem('focus-chain',S.chain?'1':'0')}catch(_){} } });
document.addEventListener('keydown',e=>{ const t=e.target, typing=t.closest&&t.closest('input,textarea,select');
  if(e.key==='Escape'){ if(S.launcher){ closeLauncher(); return; } if(typing&&t.value){ t.blur(); return; } if(S.modal){ closeModal(); return; } if(S.ideas){ S.ideas=false; drawIdeas(); return; } if(typing){ t.blur(); return; } return; }
  if(typing){
    if(t.dataset.in&&e.key==='Enter'){ e.preventDefault(); act(t.dataset.in,'send'); }
    if(t.id==='mreply'&&e.key==='Enter'&&(e.metaKey||e.ctrlKey)){ e.preventDefault(); act(S.modal,'send'); }
    if(t.id==='lq'&&e.key==='Enter'){ const b=$('layer').querySelector('.launcher [data-launch]'); b&&b.click(); }
    return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  const l=visible(); if(!l.length) return;
  if(S.modal){ const i=l.findIndex(v=>v.id===S.modal), x=byId(S.modal);
    if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); openModal(l[(i+1)%l.length].id); }
    else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); openModal(l[(i-1+l.length)%l.length].id); }
    else if(/^[1-3]$/.test(e.key)){ e.preventDefault(); primary(x,+e.key-1); }
    else if(e.key==='s'){ snooze(x.id); }
    return; }
  const x=l[S.cur];
  if(e.key==='j'||e.key==='ArrowDown'){ e.preventDefault(); S.cur=Math.min(l.length-1,S.cur+1); drawList(); scrollCur(); }
  else if(e.key==='k'||e.key==='ArrowUp'){ e.preventDefault(); S.cur=Math.max(0,S.cur-1); drawList(); scrollCur(); }
  else if(e.key==='Enter'&&!t.closest('button,a')){ e.preventDefault(); openModal(x.id); }
  else if(/^[1-3]$/.test(e.key)){ e.preventDefault(); primary(x,+e.key-1); }
  else if(e.key==='r'&&x.kind==='question'){ e.preventDefault(); document.querySelector(`[data-in="${CSS.escape(x.id)}"]`)?.focus(); }
  else if(e.key==='l'){ e.preventDefault(); const b=document.querySelector(`.row[data-id="${CSS.escape(x.id)}"] [data-ssb]`); b&&openLauncher(x.id,b); }
  else if(e.key==='s'){ snooze(x.id); }
});
function scrollCur(){ document.querySelector('.row.cur')?.scrollIntoView({block:'nearest'}); }
addEventListener('resize',()=>closeLauncher());
$('listwrap').addEventListener('scroll',()=>closeLauncher());
setInterval(()=>{ if(!document.querySelector('input:focus,textarea:focus')&&!S.launcher){ drawHead(); drawList(); } },30000);

drawAll(); drawIdeas();
})();
</script>
