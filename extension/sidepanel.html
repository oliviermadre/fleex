<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleex Assistant</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <button id="menu" class="icon" title="Conversations" aria-label="Conversations">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
      </button>
      <div class="row">
        <span class="brand">
          <svg class="brand-bolt" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor"/></svg>
          <span class="brand-name"><span class="brand-fleex">fleex</span><span class="brand-dev">.dev</span></span>
        </span>
        <span id="status" class="status off">offline</span>
      </div>
      <select id="workspace" title="Workspace for this conversation">
        <option value="">default workspace</option>
      </select>
    </header>

    <!-- Conversations sidebar -->
    <div id="overlay" class="hidden"></div>
    <aside id="sidebar" class="hidden">
      <div class="sb-head">
        <strong>Conversations</strong>
        <button id="new" class="primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New
        </button>
        <button id="sb-close" class="icon" title="Close" aria-label="Close">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>
      <ul id="sessions"></ul>
    </aside>

    <div id="state-banner" class="hidden"></div>
    <main id="log" aria-live="polite"></main>
    <div id="page-chip" class="chip hidden"></div>

    <footer>
      <button id="attach" title="Attach the current page as reference">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
        Page
      </button>
      <textarea id="input" rows="1" placeholder="Ask about your board, create a ticket…"></textarea>
      <button id="send">Send</button>
    </footer>

    <script src="themes.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
