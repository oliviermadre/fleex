<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fleex Assistant</title>
    <link rel="stylesheet" href="sidepanel.css" />
  </head>
  <body>
    <header>
      <button id="menu" class="icon" title="Conversations">☰</button>
      <div class="row">
        <strong>Fleex</strong>
        <span id="status" class="status off">offline</span>
      </div>
      <select id="workspace" title="Workspace for this conversation">
        <option value="">default workspace</option>
      </select>
    </header>

    <!-- Conversations sidebar -->
    <div id="overlay" class="hidden"></div>
    <aside id="sidebar" class="hidden">
      <div class="sb-head">
        <strong>Conversations</strong>
        <button id="new" class="primary">＋ New</button>
        <button id="sb-close" class="icon" title="Close">✕</button>
      </div>
      <ul id="sessions"></ul>
    </aside>

    <div id="state-banner" class="hidden"></div>
    <main id="log" aria-live="polite"></main>
    <div id="page-chip" class="chip hidden"></div>

    <footer>
      <button id="attach" title="Attach the current page as reference">📎 Page</button>
      <textarea id="input" rows="1" placeholder="Ask about your board, create a ticket…"></textarea>
      <button id="send">Send</button>
    </footer>

    <script src="themes.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
