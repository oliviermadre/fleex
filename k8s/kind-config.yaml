kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # HTTP traffic → NGINX Ingress Controller
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      # HTTPS traffic → NGINX Ingress Controller
      - containerPort: 443
        hostPort: 443
        protocol: TCP
