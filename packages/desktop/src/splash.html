<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fleex</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      -webkit-app-region: drag;
      user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color: #e4e4e7;
    }
    .splash {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #1a1a2e 0%, #16213e 100%);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px;
      box-sizing: border-box;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .logo svg { color: #6ee7b7; }
    .brand {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand .dot { color: #6ee7b7; }
    .status {
      font-size: 13px;
      color: #a1a1aa;
      margin-bottom: 24px;
    }
    .bar {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .bar::after {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: #6ee7b7;
      border-radius: 2px;
      animation: slide 1.4s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { left: -40%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" fill="currentColor" />
      </svg>
      <span class="brand">fleex<span class="dot">.dev</span></span>
    </div>
    <div class="status">Starting services…</div>
    <div class="bar"></div>
  </div>
</body>
</html>
